  {lv:3,cat:"Git / リモート操作",situation:"複数人が同じブランチで作業しており、他のメンバーが force push した結果、自分のローカルとリモートの履歴が食い違ってしまった。",q:"この状況の理解と対応として正しいのはどれ？",options:["共有ブランチでの履歴書き換えが原因。まず自分の未共有のコミットを退避し、リモートの新しい履歴に合わせて積み直す","自分のローカルが正しいので、改めて force push して自分の履歴に戻す","リポジトリを clone し直せば解決するので、ローカルを削除して取り直す","git pull を繰り返せば自動的に整合するので、そのまま待つ"],answer:0,explain:"force push はコミットを作り直す（ハッシュが変わる）ので、他人の手元にある「元の履歴」と辻褄が合わなくなる。だから根本原因は運用ルールの側にあり、共有ブランチでは force push しないのが原則。復旧の考え方は、自分の失いたくないコミットを退避（別ブランチや cherry-pick 用に確保）し、リモートの新しい履歴を正として、その上に積み直すこと。押し返す force push は相手の作業を消して事態を悪化させ、clone のやり直しは自分の未共有コミットを失う。"},
  {lv:3,cat:"Git / リモート操作",situation:"リモートで削除済みのブランチが、git branch -a のローカル一覧に残り続けている。",q:"正しい対処はどれ？",options:["git fetch --prune を実行し、リモートに存在しない追跡参照を整理する","git branch -d で1つずつローカルから削除する","リポジトリを再 clone して一覧を初期化する","放置しても害はないので、そのまま使い続ける"],answer:0,explain:"origin/xxx のような表示は「手元が記憶しているリモートの状態」で、Git は勝手に忘れない。だから削除済みのものを消すには prune で明示的に掃除する。古い連絡先を手帳から消す作業。git branch -d はローカルブランチ用で、リモート追跡参照には効かない（-dr が必要）。再 clone は大げさで、放置すると存在しないブランチから派生させる誤操作を招く。"},
  {lv:2,cat:"Git / リモート操作",situation:"他人のリポジトリに変更を提案したい。書き込み権限は持っていない。",q:"一般的な手順として正しいのはどれ？",options:["フォークして自分の領域に複製し、作業ブランチを作って push、そこから元リポジトリへ PR を出す","元リポジトリを clone して直接ブランチを push し、PR を作成する","変更内容をパッチファイルにして、メールで送る以外の方法はない","元リポジトリの管理者に権限を依頼し、付与されるまで作業できない"],answer:0,explain:"書き込み権限がない相手のリポジトリには push できないので、まず自分の名前空間に複製（フォーク）して、そこへ push する。そのうえで「私の側のこのブランチを取り込んでほしい」と依頼するのが PR。OSS の標準的な貢献の流れ。パッチのメール送付は Git 本来の方式として今も存在するが唯一の手段ではなく、権限付与を待つ必要もない（フォーク経由なら誰でも提案できる）。"},
  {lv:1,cat:"Git / 履歴の修正",situation:"直前のコミットのメッセージに誤字があった。まだ push していない。",q:"メッセージを直す操作として適切なのはどれ？",options:["git commit --amend でメッセージを修正する。push 済みの場合は注意が必要","誤字を修正したという内容の新しいコミットを追加する","git reset --hard HEAD~1 でコミットを消してから、やり直す","git revert で直前のコミットを打ち消してから、コミットし直す"],answer:0,explain:"amend は直前のコミットを作り直す（差分やメッセージを差し替える）ので、まだ共有していないなら最も素直。ただし作り直しなのでハッシュが変わり、push 済みだと相手の履歴と食い違うため、共有後は避けるか合意の上で force-with-lease を使う。修正コミットの追加は履歴に無意味な行が増え、reset --hard は変更内容ごと消える危険があり、revert は打ち消しコミットが増えるだけでメッセージは直らない。"},
  {lv:2,cat:"Git / 履歴の修正",situation:"git reset には --soft、--mixed、--hard の3つのオプションがある。",q:"違いとして正しいのはどれ？",options:["soft＝コミットだけ戻してステージは保持、mixed＝ステージも戻すが編集内容は保持、hard＝編集内容まで破棄","soft＝1つ戻す、mixed＝複数戻す、hard＝すべて戻すという戻す量の違い","soft＝ローカルのみ、mixed＝リモートも含む、hard＝履歴を完全削除という影響範囲の違い","3つとも最終的な結果は同じで、処理にかかる速度が違うだけである"],answer:0,explain:"どこまで巻き戻すかの深さの違い。soft はコミットを解いて内容をレジ台に残すので「コミットをまとめ直したい」ときに便利。mixed（既定）は机の上に戻す。hard は机の上まで消すので、未コミットの作業は基本的に取り戻せない（Git で最も事故が多い操作）。使う前に必要なものが手元にしか無いか確認する癖を付けるのが安全。戻す量や影響範囲、速度の違いではない。"},
  {lv:2,cat:"Git / 履歴の修正",situation:"すでに main にマージして本番へ反映したコミットに問題が見つかった。取り消したい。",q:"共有済みの変更を取り消す操作として適切なのはどれ？",options:["git revert で打ち消すコミットを新たに積む。共有済みの履歴を書き換えずに変更を無効化できる","git reset --hard で該当コミットの前まで戻し、force push する","該当コミットを手作業で逆向きに書き直し、通常のコミットとして積む","該当ファイルを以前のバージョンで上書きコミットする"],answer:0,explain:"共有済みの履歴は「他人がすでに持っているもの」なので、書き換えるとチーム全体が食い違う。だから消すのではなく、打ち消すコミットを足すのが定石（帳簿の誤記を消しゴムで消さず、訂正の行を追記するのと同じ）。revert なら「いつ何を打ち消したか」も履歴に残る。reset＋force push は他人の履歴を壊す最悪手。手作業の巻き戻しは漏れが出やすく、意図が履歴から読めない。"},
  {lv:3,cat:"Git / 履歴の修正",situation:"作業ブランチに「wip」「fix typo」など整理されていないコミットが10個ある。PR を出す前に履歴を整えたい。",q:"適切な方法はどれ？",options:["git rebase -i で意味のある単位にまとめ直す（squash/reword）","git reset --hard で全部消してから、1つのコミットとして作り直す","そのまま PR を出し、マージ時に squash して1コミットにまとめる","コミットメッセージだけを後から一括で書き換えるツールを使う"],answer:0,explain:"rebase -i は履歴の編集台。squash でまとめ、reword でメッセージを直し、drop で不要なものを落とせるので、レビュアーが読める単位に整えられる。原稿の下書きを清書するイメージ。まだ誰も持っていないブランチなら書き換えは安全（共有済みブランチでは避ける）。reset --hard は作業内容を失う危険があり、マージ時の squash も選択肢だが「1つの PR に複数の意味ある変更がある」場合は単位を分けた方がレビューしやすい。"},
  {lv:3,cat:"Git / 履歴の修正",situation:"別のブランチにある特定の1コミット（緊急のバグ修正）だけを、今のブランチに取り込みたい。ブランチ全体はマージしたくない。",q:"1コミットだけ取り込む操作として適切なのはどれ？",options:["git cherry-pick でそのコミットだけを現在のブランチに適用する","git merge で相手ブランチをマージし、不要な変更を後から revert する","該当コミットの差分を手でコピーして貼り付け、新しくコミットする","相手のブランチから該当コミット以降を reset で削除してからマージする"],answer:0,explain:"cherry-pick は名前どおり「摘み取り」で、指定コミットの変更を今のブランチに適用し直す（新しいハッシュのコミットができる）。緊急修正を hotfix から本線へ、あるいは本線から保守ブランチへ持っていく場面で使う。全部マージして後で戻す方式は履歴が汚れ、戻し漏れも起きる。手作業のコピーは意図と作者情報が失われ、相手ブランチを reset するのは他人の作業を壊す。"},
  {lv:2,cat:"Git / 履歴の修正",situation:"作業途中で急ぎの別対応が入った。今の変更はコミットしたくないが、ブランチを切り替える必要がある。",q:"変更を保持したままブランチを切り替える操作として適切なのはどれ？",options:["git stash で変更を一時退避し、別対応の後に git stash pop で戻す","中途半端な状態でも一旦コミットし、後で amend でまとめる","変更したファイルを別の場所にコピーしておき、手作業で戻す","変更を破棄して、別対応が終わってから作り直す"],answer:0,explain:"stash は作業を一時的に引き出しへ入れる仕組み。机の上を空にして別の作業をし、戻ってきたら引き出しから出せる。ただし溜め込むと何を入れたか分からなくなるので、退避時にメッセージを付け（git stash push -m）、早めに戻すのが実務的。仮コミットも有効な手段だが、そのまま push すると未完成が共有されうる。手作業コピーは戻し漏れが起き、破棄は論外。"},
  {lv:3,cat:"Git / 履歴の修正",situation:"git reset --hard を実行してしまい、必要なコミットが履歴から消えた。push はしていない。",q:"復旧の手段として正しいのはどれ？",options:["git reflog で HEAD が過去に指していた位置を調べ、該当コミットへ戻す","コミットは完全に削除されるため復旧はできない","git fsck で削除ファイルを検索し、手作業で復元する以外に方法はない","リモートから clone し直せば、消えたローカルコミットも復元される"],answer:0,explain:"reflog は「HEAD がいつどこを指していたか」の移動記録で、ブランチから外れて見えなくなったコミットもここから辿れる（既定で数週間は残る）。だから reset --hard の直後なら、多くの場合は元の位置のハッシュを見つけて復帰できる。防犯カメラの録画を見返すイメージ。ただし救えるのは「コミット済み」のものだけで、未コミットの編集内容は戻らない。push していないコミットはリモートに無いので、clone し直しても復元されない。"},
  {lv:1,cat:"Git / チーム開発とPR",situation:"PR を作成するとき、説明欄に何を書くか迷っている。",q:"レビュアーにとって最も価値がある内容はどれ？",options:["何のための変更か、どう解決したか、どう確認したか。迷った点があれば併せて書く","変更したファイルの一覧と、追加・削除した行数の合計","使用した技術やライブラリについての一般的な説明","作業にかかった時間と、実装の難易度についての自己評価"],answer:0,explain:"レビュアーが最初に知りたいのは「なぜこれが必要で、どういう方針で解いたか」。それが分かって初めて、コードが目的に対して妥当かを判断できる（目的が分からないままだと、書き方の指摘しかできない）。加えて確認方法があれば、レビュアーは同じ手順で検証できる。迷った点を書くと、そこに議論を集められて効率も上がる。ファイル一覧や行数は差分を見れば分かり、一般的な技術説明や工数は判断材料にならない。"},
  {lv:2,cat:"Git / チーム開発とPR",situation:"1つの PR に、目的の機能追加と、たまたま見つけた別の不具合修正、さらに気になったコードの整形が含まれている。",q:"望ましい対処はどれ？",options:["目的ごとに PR を分ける。レビューの精度が上がり、問題があったとき戻す単位も明確になる","1つにまとめたまま、説明欄で3つの変更を分けて説明する","不具合修正だけ分け、整形は目的の変更と同じ PR に含める","すべてまとめ、コミットを分けることでレビューしやすくする"],answer:0,explain:"1PR＝1目的が原則。混ざると、レビュアーは何を基準に判断すべきか分からなくなり、整形による大量の差分に本質的な変更が埋もれる。さらに不具合が出たとき、機能だけ戻したいのに修正も一緒に消えてしまう。買い物の会計を用途別に分けるようなもので、後から精算しやすい。説明で分けたりコミットを分けたりしても、レビューとリバートの単位は PR なので効果は限定的。整形も差分を膨らませるため分けるのが望ましい。"},
  {lv:2,cat:"Git / チーム開発とPR",situation:"PR に CI が設定されており、テストと lint が自動実行される。",q:"CI が赤（失敗）のまま議論を進めることについて、正しい考え方はどれ？",options:["まず CI を通してからレビューを依頼する。機械が見つけられる問題に人の時間を使うのは非効率","レビューと並行で修正すればよいので、赤のままレビューを依頼して構わない","CI の失敗が本質的な問題でなければ、無視してマージしてもよい","CI が不安定なら設定を一時的に無効化して、マージを優先する"],answer:0,explain:"分業の原則で、機械にできる検査（構文・書式・テストの成否）は機械に任せ、人は設計や意図といった機械には判断できないことに時間を使う。赤のままレビューを頼むと、指摘が「テスト直してください」から始まり、双方の時間が無駄になる。健康診断の数値が出る前に精密な診断を始めないのと同じ。CI が不安定（flaky）ならそれ自体を課題として直す対象で、無効化はチェックの意味を失わせる。"},
  {lv:2,cat:"Git / チーム開発とPR",situation:"レビューで「この実装だと〇〇のケースで問題が出そう」という指摘を受けた。自分は問題ないと考えている。",q:"進め方として最も適切なのはどれ？",options:["指摘の前提を確認し、自分の根拠（具体的なケースや動作結果）を示して議論する。合意できたら結論と理由を残す","レビュアーの指摘は尊重すべきなので、納得していなくても指示どおり修正する","自分の判断が正しいと考えるなら、返信せずそのままマージする","チームの第三者に判断を依頼し、多数の意見に従って決める"],answer:0,explain:"レビューは承認をもらう儀式ではなく、より良い判断に到達するための議論。指摘が的を射ていることも、前提の認識違いであることもあるので、まず前提を揃えて根拠を出し合う。納得しないまま直すと、なぜそうなっているか誰も説明できないコードが残る（後の変更で元に戻る）。無視してマージは信頼を壊す。第三者の意見は有効だが、多数決ではなく根拠で決める。そして結論と理由は PR やコミットに残すと、後任が同じ議論を繰り返さない。"},
  {lv:3,cat:"Git / チーム開発とPR",situation:"レビュー中に、変更したファイル内に以前からある明らかな不備を見つけた。今回の受け入れ条件（Done）とは直接関係しない。",q:"扱い方として最も適切なのはどれ？",options:["今回の目的達成に必要でなければ別 Issue に切り出す。必要な場合はこの PR で直す","同じファイルを触っているので、今回の PR で併せて修正する","既存の不備は担当外なので、記録も残さず触れない","気付いた時点でその場で修正し、レビュアーへの報告は省略する"],answer:0,explain:"判断基準は「同じファイルかどうか」ではなく「この PR の受け入れ条件を満たすのに必要か」。必要なら直す（直さないと目的が達成できない）、不要なら切り出す（PR の目的が増えるとレビュー精度と戻しやすさが落ちる）。ただし「触れない」も誤りで、見つけた不備は Issue として残さないと誰も知らないまま放置される。工事のついでに気付いた別の不具合を、記録して次の工程に回すのと同じ。無断修正は差分を膨らませレビュアーを混乱させる。"},
  {lv:3,cat:"Git / チーム開発とPR",situation:"PR のブランチが main から遅れており、マージ前に main の最新を取り込む必要がある。チームは共有ブランチでの履歴書き換えを禁止している。",q:"取るべき方法はどれ？",options:["main を自分のブランチにマージして取り込む。履歴に合流点は増えるが、他者の履歴と食い違わない","git rebase main で一直線に整えてから force push する","main を reset して自分のブランチの位置に合わせる","取り込まずにそのまま PR を出し、マージ時の解決に任せる"],answer:0,explain:"rebase はコミットを作り直すためハッシュが変わり、そのブランチを他の人が見ていれば食い違いが生じる（だから共有ブランチでは禁止されることが多い）。禁止されている状況では、main をマージして取り込むのが安全な選択。履歴が網目状になる代わりに、誰の手元とも矛盾しない。なお rebase 自体は悪ではなく、自分だけのブランチなら履歴を整える有効な手段。main を reset するのは本線を壊す操作で論外、未取り込みのまま放置は衝突をマージ時まで先延ばしにするだけ。"},
  {lv:2,cat:"Git / チーム開発とPR",situation:"レビュー指摘を受けて修正した。修正内容を PR に反映したい。",q:"適切な進め方はどれ？",options:["修正を新しいコミットとして追加して push する。レビュアーは差分を追いやすい","以前のコミットに amend でまとめてから force push する","PR を閉じて、修正済みの新しい PR を作り直す","修正内容をコメントに貼り付け、コードの更新はマージ後に行う"],answer:0,explain:"レビュー中の PR では「前回見たところから何が変わったか」が追えることが重要。追加コミットなら差分が明確で、指摘と対応の対応関係も残る。amend や rebase で履歴を作り直すと、レビュアーは全体を再確認せざるを得ず（差分表示が壊れることもある）、レビューコストが上がる。整理したいなら、マージ時の squash で1コミットにまとめればよい。PR の作り直しは議論の履歴を失い、マージ後の対応は約束が守られる保証がない。"},
  {lv:3,cat:"Git / チーム開発とPR",situation:"本番で緊急の不具合が発生した。修正は数行で済むが、main には他のメンバーの未リリースの変更が数件入っている。",q:"対応として最も適切なのはどれ？",options:["リリース済みの状態から hotfix ブランチを切って修正し、検証後に反映して main にも取り込む","main の最新から修正ブランチを切り、そのままデプロイする","他のメンバーの変更を revert して main を本番と同じ状態に戻してから修正する","未リリースの変更も含めて一括で検証し、まとめてリリースする"],answer:0,explain:"緊急対応の要点は「変更点を修正だけに限定する」こと。main の最新から出すと、検証していない他の変更まで本番に入り、障害対応中に新たな障害を作りかねない。だから本番と同じ地点から枝を出し、数行だけを乗せて出す（燃えている家に、確認していない荷物を運び込まない）。反映後に main へも取り込んで、修正が次のリリースから消えないようにするところまでが一連の作業。他人の変更の revert は無関係な巻き戻しで、一括検証は緊急時に時間がかかりすぎる。"},
  {lv:1,cat:"Git / チーム開発とPR",situation:"新しくチームに参加し、既存のリポジトリで作業を始める。",q:"最初に確認しておくべきこととして最も重要なのはどれ？",options:["ブランチ戦略・コミットメッセージ規約・PR とマージの手順（マージ方式を含む）","過去のコミット履歴をすべて読み、実装の経緯を把握すること","リポジトリのファイル構成を暗記して、どこに何があるか把握すること","使われているライブラリのバージョンを一覧化しておくこと"],answer:0,explain:"最初に必要なのは「このチームでの正しい進め方」。ブランチをどこから切るか、メッセージの形式、PR に何を書き誰の承認が必要か、マージはスカッシュかマージコミットか。ここを外すと、作業自体は正しくても手戻りになる（交通ルールを知らずに運転を始めるのと同じ）。多くのリポジトリでは README や CONTRIBUTING、CLAUDE.md などに書かれているので、まずそれを読む。履歴の全読やファイル構成の暗記は非現実的で、必要になった箇所を都度読む方が効率的。"},
  {lv:3,cat:"Git / 履歴の修正",situation:"自分専用のブランチで rebase して履歴を整えた。push 済みだったため通常の push は拒否される。",q:"最も適切な対処はどれ？",options:["git push --force-with-lease を使う。把握していない変更があれば失敗するので安全","git push --force を使う。自分のブランチなので無条件に上書きしてよい","リモートのブランチを削除してから、同じ名前で push し直す","rebase を取り消して、マージで取り込む形に作り直す"],answer:0,explain:"rebase はコミットを作り直すので、リモートの履歴とは食い違う。だから上書きが必要になるが、単なる --force は「自分が最後に見た時点から誰かが push していても」問答無用で消す。--force-with-lease は「自分の認識と一致していれば上書き、違えば失敗」という条件付きなので、想定外の他人の作業を守れる（保険付きの上書き）。自分専用のはずでも、CI や他人が触っていることはあるため、既定でこちらを使う。ブランチ削除＋push は同じ危険で、rebase の取り消しは目的を捨てることになる。"},
];

  "ドメイン":"example.com のような、人間が覚えられる名前。取得（登録）して自分のサーバーに紐付けて使う。",

  "HTTPS":"HTTP を TLS で暗号化した通信。盗聴防止・改ざん検知・接続先が本物かの確認ができる。守るのは通信の途中だけで、サーバー自体やアプリの脆弱性は別問題。",
  "TLS":"通信を暗号化する仕組み。HTTPS の中身。以前は SSL と呼ばれていた。",

const GLOSS_TERMS=Object.keys(GLOSSARY).sort((a,b)=>b.length-a.length);
const GLOSS_RE=new RegExp(GLOSS_TERMS.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
function escAttr(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
// テキストをエスケープしつつ、用語にハイライト用spanを付与する（同一テキスト内では各用語を1回だけ）
function gloss(text){
  const seen=new Set();
  return esc(text).replace(GLOSS_RE,(m,offset,full)=>{
    if(seen.has(m))return m;
    if(/^[\x20-\x7e]+$/.test(m)){ // 英数字の用語は、より長い単語の一部なら除外
      const b=full[offset-1],a=full[offset+m.length];
      if(b&&/[A-Za-z0-9]/.test(b))return m;
      if(a&&/[A-Za-z0-9]/.test(a))return m;
    }
    seen.add(m);
    return `<span class="term" tabindex="0" data-def="${escAttr(GLOSSARY[m])}">${m}</span>`;
  });
}
// 状況文を見やすく整形する（テキストは変えず表示だけ）。
// 「(1)…、(2)…、(3)…」のような箇条が含まれる場合、各項目を箇条書きの行に分けて表示する。
// gloss() でハイライト済みのHTMLを受け取り、(n) の番号で分割する。番号は半角/全角どちらも対応。
function formatSituation(rawText){
  // 箇条の区切り「(1)」「（1）」を検出。(1)と(2)の両方があるときだけ箇条化する。
  const numRe=/[（(]\s*([1-9１-９])\s*[）)]/g;
  const nums=[...rawText.matchAll(numRe)];
  if(nums.length<2)return `<div>${gloss(rawText)}</div>`; // 箇条が無ければそのまま
  // gloss(HTML化)はタグ内に = や ( を含むため、整形は生テキスト上で行ってから最後にglossする。
  const firstIdx=nums[0].index;
  const lead=rawText.slice(0,firstIdx).trim();
  const items=[];
  for(let i=0;i<nums.length;i++){
    const start=nums[i].index+nums[i][0].length;
    const end=(i+1<nums.length)?nums[i+1].index:rawText.length;
    let seg=rawText.slice(start,end).trim();
    seg=seg.replace(/^[、,\s]+/,'').replace(/[、,\s]+$/,''); // 端の読点を除去
    items.push({n:nums[i][1],seg});
  }
  // 各項目の生テキスト内「=」を一旦プレースホルダにし、gloss後に矢印spanへ戻す（タグ内の=と混同しないため）
  const EQ=String.fromCharCode(0xE000); // 私用領域文字。通常文やGLOSSARY語・HTMLと衝突しないプレースホルダ
  const lis=items.map(it=>{
    const seg=it.seg.replace(/\s*=\s*/,EQ);
    let g=gloss(seg).replace(EQ,' <span class="eq">→</span> ');
    return `<li><span class="num">${it.n}</span>${g}</li>`;
  }).join('');
  return `${lead?`<span class="lead">${gloss(lead)}</span>`:''}<ul class="enum">${lis}</ul>`;
}
function initGlossary(){
  const pop=document.createElement('div');
  pop.className='glosspop';pop.style.display='none';
  document.body.appendChild(pop);
  let pinned=null,timer=null;
  function show(el){
    pop.textContent=el.getAttribute('data-def');
    pop.style.display='block';pop.style.left='0px';pop.style.top='0px';
    const r=el.getBoundingClientRect();
    const pw=pop.offsetWidth,ph=pop.offsetHeight,vw=document.documentElement.clientWidth;
    let left=window.scrollX+r.left+r.width/2-pw/2;
    left=Math.max(window.scrollX+8,Math.min(left,window.scrollX+vw-pw-8));
    let top=window.scrollY+r.top-ph-10;
    if(top<window.scrollY+4)top=window.scrollY+r.bottom+10;
    pop.style.left=left+'px';pop.style.top=top+'px';
  }
  function hide(){pop.style.display='none';}
  document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('.term');if(t){clearTimeout(timer);if(!pinned)show(t);}});
  document.addEventListener('mouseout',e=>{const t=e.target.closest&&e.target.closest('.term');if(t&&!pinned)timer=setTimeout(hide,140);});
  document.addEventListener('click',e=>{
    if(e.target.closest('.glosspop'))return;
    const t=e.target.closest('.term');
    if(t){e.stopPropagation();if(pinned===t){pinned=null;hide();}else{pinned=t;show(t);}return;}
    if(pinned){pinned=null;hide();}
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){pinned=null;hide();return;}
    const ae=document.activeElement;
    if((e.key==='Enter'||e.key===' ')&&ae&&ae.classList&&ae.classList.contains('term')){
      e.preventDefault();if(pinned===ae){pinned=null;hide();}else{pinned=ae;show(ae);}
    }
  });
  window.addEventListener('scroll',()=>{if(pinned)show(pinned);else hide();},true);
  window.addEventListener('resize',()=>{if(pinned)show(pinned);else hide();});
}

// 各問がどの分野かを返す。優先度: 明示のq.track > cat名の規約（"サーバー / HTTPとAPI" のように " / " の前が分野名）

}

/* ── 間隔反復（Leitnerの箱）──────────────────────────────
  スライドの方針に従い「数値の状態は持たず、理解度ラベル(box)＋最終学習日(last)だけ」で判定する最小構成。
  box1=△まだ自信なし(約1〜2日) / box2=○なんとなく(約7日) / box3=◎説明できる(約30日)。
  答え方で箱を動かす：自力で正解→1つ上げる / ヒントあり正解→据え置き / 間違い→box1へ戻す。 */
const BOX_DAYS={1:1,2:7,3:30};
const BOX_LABEL={1:"△ まだ自信なし",2:"○ なんとなく",3:"◎ 説明できる"};
function getSrs(){try{return JSON.parse(localStorage.getItem(LS_SRS))||{};}catch(e){return {};}}
function setSrs(s){try{localStorage.setItem(LS_SRS,JSON.stringify(s));}catch(e){}}
function srsOf(q){const s=getSrs();return s[qkey(q)]||{box:1,last:null,miss:0};}
// 期限到来か：未学習はすぐ出す。box段階に応じた日数が経過していたら出題対象。
function isDue(q){
  const r=srsOf(q);
  if(!r.last)return true;
  const days=(Date.now()-new Date(r.last).getTime())/86400000;
  return days>=(BOX_DAYS[r.box]||1);
}
function dueCount(list){return list.filter(isDue).length;}
// 回答結果を箱へ反映。selfSolved=ヒント無しで自力正解、hinted=ヒント使って正解、wrongHadConfidence=自信ありで間違えた(最優先で再出題)
function recordResult(q,{correct,selfSolved,hinted,wrongHadConfidence}){
  const s=getSrs();const k=qkey(q);const r=s[k]||{box:1,last:null,miss:0};
  if(correct&&selfSolved)r.box=Math.min(3,r.box+1);   // 自力正解→1段上げる
  else if(correct&&hinted){/* ヒントあり正解→据え置き */}
  else{r.box=1;r.miss=(r.miss||0)+1;}                  // 間違い→box1へ戻す
  r.wasConfidentMiss=!!wrongHadConfidence;             // 「自信あり×不正解」は思い込み。直しても消さず何度でも出す
  r.last=new Date().toISOString();
  s[k]=r;setSrs(s);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function deleteCurrent(){

  order.splice(idx,1);

}

function start(){
  const base=trackedLive().filter(q=>!activeLevels||activeLevels.includes(q.lv));
  pool=activeCats?base.filter(q=>activeCats.includes(q.cat)):base.slice();
  if(mode==="practice"){
    // 期限到来分だけを出題。順番は毎回完全ランダム（優先度ソートはしない）。
    order=shuffle(pool.map((_,i)=>i).filter(i=>isDue(pool[i])));
  }else{
    order=shuffle(pool.map((_,i)=>i));
  }
  idx=0;score=0;answered=false;history=[];
  if(order.length===0)return renderResult();
  renderQ();
}

const marks=['A','B','C','D','E','F'];
// 各問のヒントは持たないので、選択肢から段階的に作る（白紙→比喩/カテゴリ→絞り込み→2択）。
// hideSet: 非表示にする「元index」の集合。レベルが上がるほど誤答を消して2択に近づける。
// 正解(q.answer)は決して隠さない。
function hintHideSet(q,level){
  const wrong=q.options.map((_,i)=>i).filter(i=>i!==q.answer);
  shuffle(wrong);
  const total=q.options.length;
  if(level<=1)return new Set();              // レベル0(白紙)・1(比喩)は全選択肢を見せる
  if(level===2)return new Set(wrong.slice(0,Math.max(0,total-3))); // 3択程度まで
  return new Set(wrong.slice(0,Math.max(0,total-2)));              // レベル3=2択(最後の救済)
}
const HINT_TEXT=[
  null,
  q=>`ヒント①：このカテゴリは「${q.cat}」。状況が『どの層（ブラウザ／通信／サーバー／DB／履歴）の話か』に注目。`,
  q=>`ヒント②：明らかに筋の悪い選択肢を消して、残りを絞り込みました。`,
  q=>`ヒント③（最後の救済）：2択まで絞りました。状況の目的に立ち返って選ぶ。`
];

// クイズ途中で入口（種別選択）へ戻る。回答済みの記録は都度保存されているので失うのは今回の進行状況のみ。
function goHome(){
  if(!answered&&idx<order.length&&!confirm('トップに戻りますか？\nこのクイズの進行状況はリセットされます（回答済みの記録は保存済みです）。'))return;
  activeTrack=null;activeLevels=null;activeCats=null;
  trackScreen();
}

function renderQ(){
  const s=document.getElementById('screen');
  if(idx>=order.length)return renderResult();
  const q=pool[order[idx]];
  answered=false;confidence=null;hintLevel=0;picked=false;
  viewOrder=shuffle(q.options.map((_,i)=>i)); // 選択肢の並びを毎回シャッフル（正解位置の偏りを解消）
  const r=srsOf(q);
  s.innerHTML=`
    <div class="bar" id="bar" role="progressbar" aria-label="進捗" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
    <div class="toprow">
      <span><span class="lvtag lv${q.lv}">${LV_INFO[q.lv].name}</span> <span class="cat">${esc(q.cat)}</span></span>
      <span class="meta">問題 ${idx+1} / ${order.length}　スコア ${score}<button class="pill" id="tohome" style="margin-left:10px">🏠 トップに戻る</button></span>
    </div>
    <div class="boxrow"><span class="boxtag box${r.box}">${BOX_LABEL[r.box]}</span>${r.wasConfidentMiss?'<span class="boxtag warn">⚠ 要注意（前回 自信あり→不正解）</span>':''}</div>
    <div class="situation"><div class="lbl">状況</div><div class="body">${formatSituation(q.situation)}</div></div>
    <div class="question">${gloss(q.q)}</div>
    <div id="confbox"></div>
    <div id="optwrap" style="display:none">
      <div id="hintbox"></div>
      <div class="opts" id="opts"></div>
      <div id="hintrow"></div>
    </div>
    <div id="fb" aria-live="polite"></div>
    <div id="delrow"><button class="delbtn" id="delq">🗑 この問題を削除</button></div>`;
  setBar(idx/order.length*100);
  renderConfidence();
  document.getElementById('delq').onclick=deleteCurrent;
  document.getElementById('tohome').onclick=goHome;
  // 設問遷移時に見出しへフォーカスを移し、キーボード/支援技術の文脈を保つ
  const qEl=s.querySelector('.question');if(qEl){qEl.setAttribute('tabindex','-1');qEl.focus();}
}

// 回答前に自信を聞く（分かったつもり対策）。選んでから選択肢を表示する。
function renderConfidence(){
  const cb=document.getElementById('confbox');
  cb.innerHTML=`
    <div class="conflbl">答える前に——いまの自信は？</div>
    <div class="confbtns">
      <button class="confbtn" data-c="1">自信あり</button>
      <button class="confbtn ghosty" data-c="0">自信なし</button>
    </div>
    <div class="conftip">※ 自信を先に決めることで「分かったつもり」を見つけやすくなります。</div>`;
  cb.querySelectorAll('.confbtn').forEach(b=>{
    b.onclick=()=>{confidence=b.getAttribute('data-c')==='1';revealOptions();};
  });
}

function revealOptions(){
  document.getElementById('confbox').style.display='none';
  document.getElementById('optwrap').style.display='block';
  renderOptions();
  renderHintRow();
}

function renderOptions(){
  const q=pool[order[idx]];
  const hide=hintHideSet(q,hintLevel);      // 隠す「元index」の集合
  const hb=document.getElementById('hintbox');
  hb.innerHTML=(hintLevel>0&&HINT_TEXT[hintLevel])?`<div class="hint">${gloss(HINT_TEXT[hintLevel](q))}</div>`:'';
  const opts=document.getElementById('opts');
  opts.innerHTML='';
  // 表示順(viewOrder)で並べ、ラベルA/B/C/Dは表示位置に振る。判定は元index(oi)で行う。
  let pos=0;
  viewOrder.forEach(oi=>{
    if(hide.has(oi))return;
    const b=document.createElement('button');
    b.className='opt';
    b.dataset.oi=oi;
    b.innerHTML=`<span class="mk">${marks[pos]}</span><span>${gloss(q.options[oi])}</span>`;
    b.onclick=(e)=>{if(e.target.closest('.term'))return;pick(oi);};
    opts.appendChild(b);
    pos++;
  });
}

function renderHintRow(){
  const q=pool[order[idx]];
  const hr=document.getElementById('hintrow');
  if(answered){hr.innerHTML='';return;}
  // ヒントは最大3段階（白紙の次から）。2択まで出したら打ち止め。
  if(hintLevel>=3){hr.innerHTML='<div class="hintdone">これ以上のヒントはありません。状況の目的に立ち返って選びましょう。</div>';return;}
  hr.innerHTML=`<button class="hintbtn" id="hintbtn">💡 ヒントを1段もらう（${hintLevel}/3）</button>`;
  document.getElementById('hintbtn').onclick=()=>{hintLevel++;renderOptions();renderHintRow();};
}

function pick(i){
  if(answered)return;answered=true;picked=true;
  const dr=document.getElementById('delrow');if(dr)dr.style.display='none';
  const hr=document.getElementById('hintrow');if(hr)hr.innerHTML='';
  const q=pool[order[idx]];
  const correct=i===q.answer;
  const usedHint=hintLevel>0;
  const selfSolved=correct&&!usedHint;          // 自力で正解（ヒント未使用）
  const hinted=correct&&usedHint;               // ヒントありで正解
  const wrongHadConfidence=!correct&&confidence; // 自信あり×不正解＝思い込み（最優先で再出題）
  if(correct)score++;
  history.push({cat:q.cat,correct,confidence,usedHint});
  recordResult(q,{correct,selfSolved,hinted,wrongHadConfidence});
  const opts=document.getElementById('opts').children;
  for(let k=0;k<opts.length;k++){
    opts[k].disabled=true;
    const oi=Number(opts[k].dataset.oi);
    const mk=opts[k].querySelector('.mk');
    // 色だけに依存しないよう、正誤を記号(✓/✕)でも示す
    if(oi===q.answer){opts[k].classList.add('correct');if(mk)mk.textContent='✓';}
    else if(oi===i){opts[k].classList.add('wrong');if(mk)mk.textContent='✕';}
  }
  // 自信×正誤の4象限メッセージ（分かったつもり対策）
  let quad,quadCls;
  if(correct&&confidence){quad="本物か確認：なぜ正しいかを言えれば◎へ昇格の候補。";quadCls="ok";}
  else if(correct&&!confidence){quad="まぐれ確認：理由を言えなければ据え置き。解説で裏取りを。";quadCls="warn";}
  else if(!correct&&confidence){quad="⚠ 最優先で訂正：思い込みです。直しても消さず、何度でも出題します。";quadCls="ng";}
  else{quad="想定内：基礎から学び直し。box1に戻してすぐまた出します。";quadCls="warn";}
  const r=srsOf(q);
  const moveTxt=selfSolved?`自力正解 → ${BOX_LABEL[r.box]} に昇格（次は約${BOX_DAYS[r.box]}日後）`
    :hinted?`ヒントあり正解 → 据え置き（${BOX_LABEL[r.box]}）`
    :`box1へ → すぐまた出題`;
  const last=idx+1>=order.length;
  document.getElementById('fb').innerHTML=`
    <div class="fb">
      <div class="res ${correct?'ok':'ng'}">${correct?'✓ 正解':'✕ 不正解'}　<span class="confchip">${confidence?'自信あり':'自信なし'}${usedHint?' / ヒント使用':''}</span></div>
      <div class="quad ${quadCls}">${quad}</div>
      <div class="exp"><b>解説：</b>${gloss(q.explain)}</div>
      <div class="srsmove">${moveTxt}</div>
      <button class="next" id="nx">${last?'結果を見る':'次の問題 →'}</button>
    </div>`;
  setBar((idx+1)/order.length*100);
  document.getElementById('nx').onclick=()=>{idx++;renderQ();};
}

function renderResult(){
  const total=order.length;
  if(total===0){
    const allDone=mode==="practice"&&deletedCount()===0;
    document.getElementById('screen').innerHTML=`
      <div class="result">
        <div class="big">🎉</div>
        <div class="msg">${allDone?'今やるべき復習は完了です。<br>箱が進んだ問題は、期限が来たらまた出題されます。':`出題できる問題がありません。${deletedCount()>0?'削除した問題を復元してください。':'カテゴリの選択を見直してください。'}`}</div>
        <div class="actions">
          <button class="next" onclick="mode='all';start()">全問モードで挑戦</button>
          <button class="ghost" onclick="trackScreen()">分野を選び直す</button>
          ${deletedCount()>0?`<button class="ghost" onclick="restoreDeleted();start()">削除した問題を復元（${deletedCount()}件）</button>`:''}
        </div>
      </div>`;
    return;
  }
  const pct=Math.round(score/total*100);
  let msg;
  if(pct===100)msg="完璧。パターン認識が完全に身についています。";
  else if(pct>=70)msg="優秀。実践の判断軸がしっかり定着しています。";
  else if(pct>=40)msg="良い調子。解説を見返してパターンを掴みましょう。";
  else msg="復習のチャンス。状況のタイプ判別から見直しを。";
  const b=getBest();
  let isBest=false;
  if(b.pct==null||pct>b.pct){setBest({pct,score,total});isBest=true;}
  renderBest();
  // 「自信あり×不正解（思い込み）」の件数を集計＝最優先で潰すべきもの
  const confMiss=history.filter(h=>!h.correct&&h.confidence).length;
  const selfSolved=history.filter(h=>h.correct&&!h.usedHint).length;
  const remainDue=dueCount(mode==="practice"?pool:trackedLive().filter(q=>!activeLevels||activeLevels.includes(q.lv)));
  document.getElementById('screen').innerHTML=`
    <div class="result">
      <div class="big">${pct}%</div>
      <div class="of">${score} / ${total} 問正解${isBest?'　🎉 自己ベスト更新':''}</div>
      <div class="msg">${msg}</div>
      <div class="srsstat">
        <span>自力正解 <b>${selfSolved}</b></span>
        <span class="${confMiss>0?'bad':''}">思い込み(自信あり→不正解) <b>${confMiss}</b></span>
        <span>残りの復習 <b>${remainDue}</b></span>
      </div>
      ${confMiss>0?`<div class="quad ng" style="text-align:left">⚠ 「自信があったのに間違えた」問題が${confMiss}件あります。一番危ないので、消えずに何度でも出題されます。</div>`:''}
      <div class="review">
        ${history.map(h=>`<div class="rrow"><span>${esc(h.cat)}</span><span class="ic ${h.correct?'ok':'ng'}">${h.correct?'✓':'✕'}${h.confidence?'（自信あり）':''}</span></div>`).join('')}
      </div>
      <div class="actions">
        <button class="next" onclick="mode='practice';start()">続けて復習する</button>
        <button class="ghost" onclick="trackScreen()">分野/レベルを選び直す</button>
        ${deletedCount()>0?`<button class="ghost" onclick="restoreDeleted();start()">削除した問題を復元（${deletedCount()}件）</button>`:''}
      </div>
    </div>
    <div class="note">記録（理解度の箱・最終学習日）はこの端末に保存されます。<br>復習モードは「期限が来た問題・苦手な問題」だけを出します。新しい問題はClaudeに「クイズ更新して」と伝えてください。</div>`;
}

// 最初の画面：分野（全体像 / サーバー / フロント / Git）を選ぶ
function trackScreen(){
  const live=liveQuestions();
  const cnt=t=>live.filter(q=>trackOf(q)===t).length;
  const s=document.getElementById('screen');
  s.innerHTML=`
    <div style="margin-bottom:10px;font-size:14px;color:var(--txt2);">まず分野を選んでください</div>
    <div class="levels">
      ${Object.keys(TRACK_INFO).map(k=>`<button class="levelcard trackcard ${TRACK_INFO[k].cls}" data-t="${k}">
        <div class="lvname">${TRACK_INFO[k].icon} ${TRACK_INFO[k].name}<span class="lvcnt">${cnt(k)}問</span></div>
        <div class="lvdesc">${TRACK_INFO[k].desc}</div>
      </button>`).join('')}
    </div>
    <div class="actions">
      <button class="ghost" onclick="activeTrack=null;activeLevels=null;activeCats=null;levelScreen()">全分野をまとめて選ぶ（${live.length}問）</button>
    </div>`;
  s.querySelectorAll('.trackcard').forEach(b=>{
    b.onclick=()=>{activeTrack=b.getAttribute('data-t');activeLevels=null;activeCats=null;levelScreen();};
  });
}

function levelScreen(){
  const live=trackedLive();
  const cnt=l=>live.filter(q=>q.lv===l).length;
  const trackLabel=activeTrack?TRACK_INFO[activeTrack].name:'全分野';
  const s=document.getElementById('screen');
  s.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;">
      <span class="lvtag">分野：${esc(trackLabel)}（${live.length}問）</span>
      <button class="pill" onclick="trackScreen()">↩ 分野を選び直す</button>
    </div>
    <div style="margin-bottom:10px;font-size:14px;color:var(--txt2);">レベルを選んでください</div>
    <div class="levels">
      ${[1,2,3].map(l=>`<button class="levelcard lv${l}" data-l="${l}">
          <div class="lvname">${LV_INFO[l].name}<span class="lvcnt">${cnt(l)}問</span></div>
          <div class="lvdesc">${LV_INFO[l].desc}</div>
        </button>`).join('')}
    </div>
    <div class="actions">
      <button class="ghost" onclick="activeLevels=null;activeCats=null;catScreen()">すべてのレベルから選ぶ（${live.length}問）</button>
    </div>`;
  s.querySelectorAll('.levelcard').forEach(b=>{
    b.onclick=()=>{activeLevels=[Number(b.getAttribute('data-l'))];activeCats=null;catScreen();};
  });
}

function catScreen(){
  const lvLive=trackedLive().filter(q=>!activeLevels||activeLevels.includes(q.lv));
  const cats=[...new Set(lvLive.map(q=>q.cat))];
  if(!activeCats)activeCats=cats.slice();
  else activeCats=activeCats.filter(c=>cats.includes(c));
  const due=dueCount(lvLive);
  const trackLabel=activeTrack?TRACK_INFO[activeTrack].name:'全分野';
  const lvLabel=activeLevels?activeLevels.map(l=>LV_INFO[l].name).join('・'):'すべてのレベル';
  const s=document.getElementById('screen');
  s.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;">
      <span class="lvtag${activeLevels&&activeLevels.length===1?' lv'+activeLevels[0]:''}">${esc(trackLabel)}／${lvLabel}（${lvLive.length}問）</span>
      <button class="pill" onclick="levelScreen()">↩ レベル/分野を選び直す</button>
    </div>
    <div style="margin-bottom:12px;font-size:14px;color:var(--txt2);">出題モード</div>
    <div class="pills" id="modes">
      <button class="pill${mode==='practice'?' on':''}" data-m="practice" aria-pressed="${mode==='practice'}">復習（期限到来・苦手を優先）${due>0?` ・ ${due}問`:''}</button>
      <button class="pill${mode==='all'?' on':''}" data-m="all" aria-pressed="${mode==='all'}">全問（カテゴリ内ランダム）</button>
    </div>
    <div style="margin:18px 0 8px;font-size:14px;color:var(--txt2);">カテゴリ（タップで切替）</div>
    <div class="pills" id="pills"></div>
    <div class="actions">
      <button class="next" onclick="start()">スタート</button>
      <button class="ghost" onclick="activeCats=null;start()">全カテゴリで開始</button>
      ${deletedCount()>0?`<button class="ghost" onclick="restoreDeleted();catScreen()">削除した問題を復元（${deletedCount()}件）</button>`:''}
    </div>`;
  s.querySelectorAll('#modes .pill').forEach(b=>{
    b.onclick=()=>{mode=b.getAttribute('data-m');catScreen();};
  });
  const p=document.getElementById('pills');
  cats.forEach(c=>{
    const b=document.createElement('button');
    b.className='pill'+(activeCats.includes(c)?' on':'');
    b.setAttribute('aria-pressed',activeCats.includes(c));
    b.textContent=c;
    b.onclick=()=>{
      if(activeCats.includes(c))activeCats=activeCats.filter(x=>x!==c);
      else activeCats.push(c);
      if(activeCats.length===0)activeCats.push(c);
      catScreen();
    };
    p.appendChild(b);
  });
}

initGlossary();
renderBest();
trackScreen();
</script>
</body>
</html>
