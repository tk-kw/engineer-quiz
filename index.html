<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 更新を即反映させるためHTMLのキャッシュを抑止（古い版が表示される問題への対策） -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>IT基礎クイズ — サーバー / フロントエンド / Git</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e1117'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%237c6cff' stroke-width='4'/%3E%3Cpath d='M32 15 L32 49' stroke='%233ad0a8' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M15 32 L49 32' stroke='%233ad0a8' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1117;
    --bg2:#161b25;
    --card:#1c2230;
    --line:rgba(255,255,255,.08);
    --line2:rgba(255,255,255,.16);
    --txt:#e8eaf0;
    --txt2:#9aa3b5;
    --txt3:#868fa3;            /* AA確保: card上4.9 / bg上5.8（旧#646d80は3.0で不足） */
    --accent:#7c6cff;          /* タグ・枠線など（白文字でない用途）用 */
    --accent2:#3ad0a8;
    --btn:#6354d6;             /* 白文字ボタン用（白×#6354d6=5.6でAA達成） */
    --btn2:#6a5ae0;
    --accent-txt:#b9b0ff;      /* アクセント上の明るい文字 */
    --pop:#0b0f16;             /* 用語ポップアップ背景 */
    --card2:#222a3a;           /* 選択肢hover背景 */
    --ok:#3ad08a;
    --okbg:rgba(58,208,138,.12);
    --ng:#ff6b6b;
    --ngbg:rgba(255,107,107,.12);
    --warn:#ffb84d;
    --info:#5aa9ff;
    --font:'Noto Sans JP',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic',Meiryo,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    background:var(--bg);
    color:var(--txt);
    font-family:var(--font);
    line-height:1.7;
    min-height:100vh;
    background-image:radial-gradient(circle at 15% -10%,rgba(124,108,255,.18),transparent 45%),radial-gradient(circle at 90% 0%,rgba(58,208,168,.12),transparent 40%);
    background-attachment:fixed;
  }
  .wrap{max-width:680px;margin:0 auto;padding:28px 20px 60px;}
  header{margin-bottom:22px;}
  .kicker{font-family:var(--font);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent2);font-weight:600;}
  h1{font-size:26px;font-weight:700;margin:4px 0 2px;letter-spacing:.01em;}
  .sub{font-size:13px;color:var(--txt2);}
  .best{font-family:var(--font);font-size:12px;color:var(--txt3);margin-top:8px;}
  .best b{color:var(--accent2);}

  .bar{height:5px;background:var(--bg2);border-radius:99px;overflow:hidden;margin:18px 0;}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .4s cubic-bezier(.2,.8,.2,1);width:0;}

  .toprow{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .cat{font-family:var(--font);font-size:12px;font-weight:600;letter-spacing:.04em;padding:5px 13px;border-radius:99px;background:rgba(124,108,255,.16);color:var(--accent-txt);}
  .meta{font-family:var(--font);font-size:12px;color:var(--txt2);}

  .situation{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px;}
  .situation .lbl{font-size:11px;letter-spacing:.1em;color:var(--txt3);font-family:var(--font);text-transform:uppercase;margin-bottom:7px;}
  .situation .body{font-size:15px;color:var(--txt);overflow-wrap:anywhere;}
  /* 状況文の自動整形：(1)(2)(3)の箇条を行に分けて読みやすくする */
  .situation .body .lead{display:block;margin-bottom:6px;}
  .situation .body ul.enum{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .situation .body ul.enum > li{position:relative;padding:9px 12px 9px 40px;background:var(--card);border:1px solid var(--line);border-radius:11px;line-height:1.6;}
  .situation .body ul.enum > li .num{position:absolute;left:11px;top:9px;width:21px;height:21px;border-radius:7px;background:rgba(124,108,255,.2);color:var(--accent-txt);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--font);}
  .situation .body ul.enum > li .eq{color:var(--accent2);font-weight:600;}
  .question{font-size:18px;font-weight:700;margin-bottom:14px;overflow-wrap:anywhere;}
  .question:focus{outline:none;}

  .opts{display:flex;flex-direction:column;gap:10px;}
  .opt{
    text-align:left;background:var(--card);border:1.5px solid var(--line);color:var(--txt);
    padding:14px 16px;border-radius:13px;font-family:inherit;font-size:14.5px;line-height:1.55;
    cursor:pointer;transition:all .15s;width:100%;display:flex;gap:11px;align-items:flex-start;overflow-wrap:anywhere;
  }
  .opt .mk{flex-shrink:0;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font-family:var(--font);font-size:12px;font-weight:600;color:var(--txt2);margin-top:1px;}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--card2);}
  .opt:disabled{cursor:default;}
  .opt.correct{border-color:var(--ok);background:var(--okbg);}
  .opt.correct .mk{background:var(--ok);border-color:var(--ok);color:#062;}
  .opt.wrong{border-color:var(--ng);background:var(--ngbg);}
  .opt.wrong .mk{background:var(--ng);border-color:var(--ng);color:#600;}

  .fb{margin-top:16px;animation:rise .3s ease;}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .fb .res{font-weight:700;font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:7px;}
  .fb .res.ok{color:var(--ok);}
  .fb .res.ng{color:var(--ng);}
  .fb .exp{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 16px;font-size:14px;color:var(--txt2);overflow-wrap:anywhere;}
  .fb .exp b{color:var(--txt);font-weight:500;}

  button.next{margin-top:14px;background:linear-gradient(90deg,var(--btn),var(--btn2));color:#fff;border:none;padding:13px 24px;border-radius:12px;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;transition:transform .12s,filter .12s;}
  button.next:hover{filter:brightness(1.08);}
  button.next:active{transform:scale(.97);}

  .result{text-align:center;padding:10px 0;}
  .result .big{font-family:var(--font);font-size:54px;font-weight:600;line-height:1;color:var(--accent2);background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin:6px 0;}
  .result .of{color:var(--txt3);font-size:16px;}
  .result .msg{font-size:15px;color:var(--txt2);margin:14px 0 22px;}
  .review{display:flex;flex-direction:column;gap:7px;margin-bottom:24px;text-align:left;}
  .rrow{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:10px 14px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;}
  .rrow .ic{font-weight:700;}
  .rrow .ic.ok{color:var(--ok);}
  .rrow .ic.ng{color:var(--ng);}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  button.ghost{background:var(--card);color:var(--txt);border:1.5px solid var(--line2);padding:12px 22px;border-radius:12px;font-family:var(--font);font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;}
  button.ghost:hover{border-color:var(--accent);}
  .pills{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:20px;}
  .pill{font-family:var(--font);font-size:12px;min-height:32px;padding:6px 13px;border-radius:99px;border:1px solid var(--line2);color:var(--txt2);cursor:pointer;background:transparent;transition:all .15s;display:inline-flex;align-items:center;}
  .pill.on{background:var(--btn);border-color:var(--btn);color:#fff;}
  .note{font-size:12px;color:var(--txt3);text-align:center;margin-top:30px;line-height:1.6;}

  .term{color:var(--accent2);border-bottom:1px dashed rgba(58,208,168,.45);cursor:help;}
  .term:hover,.term:focus{color:#fff;border-bottom-color:var(--accent2);}
  .term:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:3px;}
  .glosspop{position:absolute;z-index:60;max-width:min(300px,86vw);background:var(--pop);border:1px solid var(--line2);border-radius:10px;padding:10px 13px;font-size:13px;line-height:1.55;color:var(--txt);box-shadow:0 10px 30px rgba(0,0,0,.55);font-family:var(--font);overflow-wrap:anywhere;}
  .glosspop b{color:var(--accent2);font-weight:500;}

  #delrow{margin-top:18px;text-align:center;}
  .delbtn{background:transparent;border:1px solid var(--line);color:var(--txt3);padding:8px 16px;border-radius:10px;font-family:var(--font);font-size:12px;cursor:pointer;transition:all .15s;}
  .delbtn:hover{border-color:var(--ng);color:var(--ng);}

  /* 間隔反復の箱タグ */
  .boxrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .boxtag{font-family:var(--font);font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:99px;border:1px solid var(--line2);color:var(--txt2);}
  .boxtag.box1{color:var(--ng);border-color:rgba(255,107,107,.4);background:var(--ngbg);}
  .boxtag.box2{color:var(--warn);border-color:rgba(255,184,77,.4);background:rgba(255,184,77,.1);}
  .boxtag.box3{color:var(--ok);border-color:rgba(58,208,138,.4);background:var(--okbg);}
  .boxtag.warn{color:var(--warn);border-color:rgba(255,184,77,.5);background:rgba(255,184,77,.12);}

  /* 回答前の自信ヒアリング */
  .conflbl{font-size:15px;font-weight:700;margin:4px 0 12px;}
  .confbtns{display:flex;gap:10px;}
  .confbtn{flex:1;background:linear-gradient(90deg,var(--btn),var(--btn2));color:#fff;border:none;padding:14px;border-radius:12px;font-family:var(--font);font-size:15px;font-weight:700;cursor:pointer;transition:transform .12s,filter .12s;}
  .confbtn:hover{filter:brightness(1.08);}
  .confbtn:active{transform:scale(.97);}
  .confbtn.ghosty{background:var(--card);color:var(--txt);border:1.5px solid var(--line2);}
  .confbtn.ghosty:hover{border-color:var(--accent);filter:none;}
  .conftip{font-size:12px;color:var(--txt3);margin-top:10px;}

  /* ヒント */
  #hintbox{margin-bottom:10px;}
  .hint{background:rgba(90,169,255,.1);border:1px solid rgba(90,169,255,.3);border-radius:11px;padding:10px 14px;font-size:13.5px;color:#bcd9ff;}
  #hintrow{margin-top:12px;}
  .hintbtn{background:transparent;border:1px dashed var(--line2);color:var(--info);padding:9px 16px;border-radius:10px;font-family:var(--font);font-size:13px;cursor:pointer;transition:all .15s;}
  .hintbtn:hover{border-color:var(--info);background:rgba(90,169,255,.08);}
  .hintdone{font-size:12px;color:var(--txt3);}

  /* 採点後の4象限メッセージ・箱の移動 */
  .confchip{font-family:var(--font);font-size:12px;font-weight:500;color:var(--txt2);}
  .quad{border-radius:11px;padding:10px 14px;font-size:13.5px;margin-bottom:10px;}
  .quad.ok{background:var(--okbg);border:1px solid rgba(58,208,138,.35);color:#8ef0c4;}
  .quad.warn{background:rgba(255,184,77,.1);border:1px solid rgba(255,184,77,.35);color:#ffd591;}
  .quad.ng{background:var(--ngbg);border:1px solid rgba(255,107,107,.4);color:#ff9d9d;}
  .srsmove{font-family:var(--font);font-size:12.5px;color:var(--txt3);margin:10px 0 4px;}

  /* 結果のSRSサマリ */
  .srsstat{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0 16px;font-size:12.5px;color:var(--txt2);font-family:var(--font);}
  .srsstat span{background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:5px 13px;}
  .srsstat span b{color:var(--txt);font-size:14px;}
  .srsstat span.bad{border-color:rgba(255,107,107,.4);color:#ff9d9d;}
  .srsstat span.bad b{color:var(--ng);}

  /* レベル選択画面 */
  .levels{display:flex;flex-direction:column;gap:12px;margin:6px 0 18px;}
  .levelcard{text-align:left;background:var(--card);border:1px solid var(--line);border-left-width:3px;border-radius:14px;padding:15px 18px;cursor:pointer;font-family:var(--font);transition:transform .12s,border-color .12s;}
  .levelcard:hover{transform:translateY(-1px);border-color:var(--accent);}
  .levelcard.lv1{border-left-color:var(--ok);}
  .levelcard.lv2{border-left-color:var(--info);}
  .levelcard.lv3{border-left-color:var(--ng);}
  .lvname{font-size:16px;font-weight:700;color:var(--txt);display:flex;align-items:center;gap:10px;}
  .lvcnt{font-size:11px;font-weight:600;color:var(--txt3);background:var(--bg2);border:1px solid var(--line);padding:2px 9px;border-radius:99px;}
  .lvdesc{font-size:12.5px;color:var(--txt2);margin-top:6px;line-height:1.55;}
  .lvtag{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--line2);color:var(--txt2);}
  .lvtag.lv1{border-color:var(--ok);color:var(--ok);}
  .lvtag.lv2{border-color:var(--info);color:var(--info);}
  .lvtag.lv3{border-color:var(--ng);color:#ff9d9d;}

  /* 分野（全体像 / サーバー / フロント / Git）選択画面：レベルカードのスタイルを流用 */
  .trackcard.t-ov{border-left-color:var(--info);}
  .trackcard.t-sv{border-left-color:var(--accent2);}
  .trackcard.t-fe{border-left-color:var(--warn);}
  .trackcard.t-git{border-left-color:var(--accent);}

  /* 視覚的な動きを抑える設定の尊重 */
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">IT Fundamentals</div>
    <h1>IT基礎クイズ</h1>
    <div class="sub">サーバー・フロントエンド・Git が開発全体でどう関わるかを、体系的に身につける</div>
    <div class="sub" style="font-size:12px;color:var(--txt3);margin-top:3px;">下線つきの語句はカーソル/タップで意味が見られます</div>
    <div class="best" id="best"></div>
  </header>
  <div id="screen"></div>
</div>

<script>
const QUESTIONS = [
  {lv:1,cat:"全体像 / リクエストの流れ",situation:"ブラウザのアドレス欄に https://example.com と入力して Enter を押した。画面が出るまでの間に、裏では複数の段階が順番に進んでいる。",q:"一番最初に行われるのはどれ？",options:["ドメイン名（example.com）を、通信先を特定できる IP アドレスに変換する","HTML を解析して DOM を組み立てる","サーバーがデータベースに問い合わせて記事一覧を取得する","CSS を読み込んで画面のレイアウトを決める"],answer:0,explain:"人間は「example.com」という名前で覚えるが、実際の通信は IP アドレス（例: 93.184.216.34）宛てに行われる。そこで最初に DNS へ「この名前の住所はどこ？」と聞く（名前解決）。電話帳で名前から番号を引くのと同じ。住所が分からなければ接続もリクエストもできないので、DNS はすべての通信の入口。DOM 構築・DB 問い合わせ・CSS 適用はどれも「サーバーに繋がってレスポンスが返ってきた後」の話。"},
  {lv:1,cat:"全体像 / リクエストの流れ",situation:"Web の通信は「クライアント」と「サーバー」の役割分担で成り立っている。",q:"この2つの関係を最も正しく説明しているのはどれ？",options:["クライアントが「これをください」と要求し、サーバーが応じて返す。やりとりは常にクライアント側から始まる","サーバーが定期的にクライアントへデータを送りつけ、クライアントは受け取るだけの受動的な存在である","クライアントとサーバーは対等で、どちらからでも自由に通信を開始できるのが HTTP の基本である","クライアントは画面表示だけを担当し、計算処理はすべてサーバーが行わなければならない"],answer:0,explain:"HTTP は「リクエスト（要求）→レスポンス（応答）」の一往復が基本単位で、口を開くのは必ずクライアント側。レストランで客が注文しないと料理が出てこないのと同じ。サーバーが勝手に送りつけることは（WebSocket などの別の仕組みを使わない限り）できない。なお「計算はすべてサーバー」も誤りで、入力チェックや画面の切り替えなどクライアント側で動く処理は大量にある（どちらでやるかは設計判断）。"},
  {lv:2,cat:"全体像 / リクエストの流れ",situation:"1つの Web ページを表示したとき、開発者ツールの Network タブには数十件の通信行が並んでいた。HTML は1件だけなのに、行数はそれよりずっと多い。",q:"なぜ通信が何十回も発生するのか、正しい説明はどれ？",options:["最初に HTML が返り、その中に書かれた CSS・JS・画像・フォント・API を、ブラウザが追加で1つずつ取りに行くから","HTTP は1回の通信で1KB しか送れない仕様なので、大きなファイルは自動的に分割送信されるから","ブラウザが通信の失敗に備えて、同じリクエストを数回ずつ再送しているから","サーバーがページ内のすべての要素を、要素ごとに別々のレスポンスとして順次プッシュしてくるから"],answer:0,explain:"最初に返ってくる HTML は「材料表」に近い。ブラウザはそれを読みながら、link や script や img で参照されている実体を追加でリクエストする。さらに画面表示後、JavaScript が API を叩いてデータを取ることもある。だから通信は1回では終わらず、HTML→部品→データと連鎖する。この構造が分かると「表示が遅い」ときに、どの行が遅いのかを Network タブで特定できるようになる。"},
  {lv:2,cat:"全体像 / リクエストの流れ",situation:"同じサイト内に、常に同じ内容を返す会社概要ページと、ログインユーザーごとに違う内容を返すマイページがある。",q:"「静的」と「動的」の違いとして正しいのはどれ？",options:["静的＝置いてあるファイルをそのまま返す。動的＝リクエストごとにサーバーが処理してレスポンスを組み立てる","静的＝HTML だけのページ。動的＝JavaScript を含むページという区別である","静的＝更新頻度が低いページ。動的＝更新頻度が高いページという運用上の区別である","静的＝キャッシュされるページ。動的＝キャッシュされないページという仕様上の区別である"],answer:0,explain:"境目は「返す中身を都度作っているか」。静的はファイルをそのまま返すだけなので速く、CDN にも置きやすい。動的はリクエスト内容（誰が・どのパラメータで）に応じてサーバーが DB を見て HTML や JSON を組み立てる。JS の有無や更新頻度は結果的に相関することはあっても定義ではない。キャッシュ可否も「動的だからキャッシュ不可」ではなく設定次第。"},
  {lv:2,cat:"全体像 / リクエストの流れ",situation:"画面に商品一覧を出す機能。ブラウザ→API サーバー→データベースという3者が関わる。",q:"データが画面に出るまでの流れとして正しいのはどれ？",options:["ブラウザが API に問い合わせ、API が DB へ SQL を投げ、返った結果を JSON にして返す","ブラウザが直接 DB に接続して SQL を投げ、結果を JSON に変換して描画する","DB が変更を検知して API に通知し、API がブラウザへ自動で画面を送り込む","API が起動時に DB の全データをブラウザへ配り、以降ブラウザ内だけで完結する"],answer:0,explain:"ブラウザは DB に直接触らない。DB の接続情報を持たせたら誰でも全データを抜けてしまうので、間に API を挟んで「誰が・何を・どこまで取れるか」を制御する。空港の保安検査のように、必ず一箇所を通す設計。この3段構成を覚えておくと、不具合が起きたとき「ブラウザ〜API 間」か「API〜DB 間」かで切り分けられる。"},
  {lv:3,cat:"全体像 / リクエストの流れ",situation:"公開したページを開くと画面が真っ白で何も表示されない。開発者ツールを開くのが最初の一手だが、どこを見るかで分かることが変わる。",q:"「どこまで正常に進んだか」を最短で切り分ける見方はどれ？",options:["Network で HTML のステータスを確認し、200 なら Console のエラーと JS の取得結果を見る","Elements タブで DOM を確認し、目的の要素が無ければフロントの描画バグと断定する","ブラウザのキャッシュを全消去して再読み込みし、直ればキャッシュ問題として調査を終える","サーバーの CPU 使用率とメモリを確認し、負荷が原因かどうかを最初に判断する"],answer:0,explain:"切り分けは「通信の下流から上流へ」ではなく「流れの順番どおり」に見るのが速い。まず HTML が返っているか（404 や 500 ならサーバー側の話）、返っていれば次に部品の取得と JS 実行（Console の赤いエラー）。この順で見れば、サーバー到達前・到達後・描画時のどこで止まったかが1〜2分で決まる。DOM だけ見て断定したり、キャッシュ消去で直ったからと調査を止めると、根本原因（古い成果物が配信され続けている等）を見逃す。"},
  {lv:3,cat:"全体像 / リクエストの流れ",situation:"修正を本番へ反映したのに、ブラウザで見ると古い表示のまま。別の端末や別のブラウザでは新しくなっている。",q:"まず疑うべき原因はどれ？",options:["自分のブラウザや CDN に古いファイルがキャッシュとして残っている","データベースの中身が更新されていない","サーバーのデプロイが失敗して古いコードが動き続けている","API が古いバージョンのレスポンスを返す設定になっている"],answer:0,explain:"「他の端末では新しい」という事実が決定的な手がかり。サーバーやDB側が古いなら全員が古く見えるはずなので、原因は自分側（またはその経路）に絞られる。ブラウザキャッシュ、あるいは自分がアクセスした CDN のエッジに古い版が残っているのが典型。冷蔵庫に古い作り置きが残っていて、それを食べているだけの状態。切り分けの原則は「症状が全員か自分だけか」で、これだけで調べる範囲が半分になる。"},
  {lv:2,cat:"全体像 / リクエストの流れ",situation:"HTTP は「ステートレス（状態を持たない）」なプロトコルだと説明される。しかしログインすると、ページを移動しても自分のマイページが表示され続ける。",q:"この矛盾しない仕組みの説明はどれ？",options:["リクエストごとに Cookie などで識別情報を一緒に送り、サーバーは毎回それを見て「誰か」を判断している","一度ログインするとサーバーとの接続が張られたままになり、その接続を通じて同一ユーザーと認識される","サーバーがブラウザの IP アドレスを記憶し続けることで、ユーザーを同一人物として扱っている","HTTP は本来ステートフルであり、ステートレスというのは静的ファイル配信に限った話である"],answer:0,explain:"HTTP 自体は1回ごとに記憶を失う（前のリクエストを覚えていない）。そこで毎回、身分証を提示し直す仕組みを上に乗せる。それが Cookie に入れたセッション ID やトークン。テーマパークで入場時にリストバンドを付け、アトラクションごとに見せるのと同じ。接続が張られ続けているわけではないし、IP は共有や変動があるため識別には使えない。"},
  {lv:1,cat:"全体像 / 登場人物と役割",situation:"求人票に「フロントエンド」「バックエンド」という区分が書かれている。",q:"2つの境界を最も適切に表しているのはどれ？",options:["ユーザーの手元（ブラウザ）で動く部分がフロントエンド、サーバー側で動く部分がバックエンド","見た目に関わる部分がフロントエンド、ロジックがある部分がバックエンド","HTML/CSS がフロントエンド、JavaScript 以降がすべてバックエンド","画面数が少ない側がフロントエンド、データ量が多い側がバックエンドという規模の区分"],answer:0,explain:"境界は「どこで実行されるか」。ユーザーの端末で動くならフロント、サーバーで動くならバック。この線引きが重要なのは、フロントのコードは全部ユーザーに見えてしまう（改変もできる）から。だから「値段の計算」や「権限チェック」のような信用が必要な処理はサーバー側に置く。見た目かロジックかではないし、JavaScript はフロントでもサーバー（Node.js）でも動くので言語で分けることもできない。"},
  {lv:1,cat:"全体像 / 登場人物と役割",situation:"アプリが扱うデータ（ユーザー情報・注文履歴など）はデータベースに保存される。",q:"データベースを使う理由として最も本質的なのはどれ？",options:["大量のデータを、消えないように保存し、条件で高速に検索し、同時アクセスでも矛盾なく更新できるから","ファイルに保存するとサーバーの容量を圧迫するため、外部に置く必要があるから","プログラムから扱えるデータ形式がテーブル形式しかないから","バックアップを自動で取ってくれる唯一の仕組みだから"],answer:0,explain:"「保存できる」だけならファイルでもできる。DB の本当の価値は、①電源が落ちても消えない（永続性）、②「東京在住かつ今月注文した人」のような検索が一瞬で返る（インデックス）、③複数人が同時に更新しても矛盾しない（トランザクション）の3点。倉庫に棚番号と台帳と整理担当がついた状態。容量やバックアップは付随的な話。"},
  {lv:1,cat:"全体像 / 登場人物と役割",situation:"「API を叩く」「API を用意する」という言い方を頻繁に聞く。",q:"API の説明として最も適切なのはどれ？",options:["外部から決まった形式で呼び出せる「窓口」。内部の作りを隠したまま、機能やデータを他者に使わせる","プログラム間でデータをやりとりするための、JSON 形式のファイルそのもの","サーバーの中にあるデータベースへ、外部から直接接続するための接続情報","Web サイトの URL のうち、画面を持たないものを指す呼び方"],answer:0,explain:"API は「窓口（契約）」。役所の窓口に決まった書式で申請すれば、中の事務処理を知らなくても結果が受け取れるのと同じ。大事なのは①呼び方が決まっている（URL・メソッド・パラメータ）、②中身の実装は隠れている（内部を作り替えても窓口が同じなら利用側は影響なし）の2点。JSON は「やりとりのときによく使う書式」にすぎず、API そのものではない。"},
  {lv:2,cat:"全体像 / 登場人物と役割",situation:"画像や CSS の配信が遅く、海外からのアクセスだと特に体感が悪い。CDN の導入を検討している。",q:"CDN が効く理由の説明として正しいのはどれ？",options:["世界各地のサーバーにファイルの複製を置き、利用者から一番近い場所から返すことで距離と負荷を減らす","ファイルを自動的に圧縮してサイズを小さくすることで、通信量を根本的に削減する","サーバーの CPU を増やして同時処理数を引き上げることで、応答を速くする","データベースの検索結果を保存しておき、同じ検索を高速に返す仕組みである"],answer:0,explain:"CDN の核心は「距離を短くする」こと。通信は物理的に遠いほど遅いので、東京のサーバーに置いた画像をロンドンから取ると往復に時間がかかる。各地にコンビニのように分身を置き、近い店から渡すのが CDN。同時に元サーバーへのアクセスも減るので負荷対策にもなる。圧縮や DB キャッシュは別の仕組み（CDN が付随的に圧縮することはあるが本質ではない）。"},
  {lv:2,cat:"全体像 / 登場人物と役割",situation:"Node.js の登場により、ブラウザ用の言語だった JavaScript がサーバーでも動くようになった。",q:"これによって実務上、最も意味が大きい変化はどれ？",options:["フロントとサーバーで同じ言語・同じ型定義・同じ検証ロジックを共有でき、二重実装のズレを減らせる","JavaScript の実行速度が他の言語より速くなり、性能面で有利になった","ブラウザ上でデータベースへ直接接続できるようになった","サーバー側のコードもユーザーのブラウザに配信されるようになった"],answer:0,explain:"最大の利点は「言語の統一による共有」。たとえば「メールアドレスの形式チェック」をフロントとサーバーで別言語で二重に書くと、片方だけ直して仕様がズレる事故が起きる。同じ言語なら検証ロジックや型を1つに寄せられる。速度が速くなるわけではなく、DB への直接接続が許されるわけでもない（サーバー側コードはユーザーに配信されない）。"},
  {lv:2,cat:"全体像 / 登場人物と役割",situation:"チームで「この処理はフロントに置くか、サーバーに置くか」を議論している。対象は「注文金額の合計と割引の計算」。",q:"配置の判断として最も適切なのはどれ？",options:["最終的な金額はサーバーで計算して確定する。フロントでも同じ計算を表示用に行ってよいが、正解はサーバー側","フロントで計算した金額をサーバーへ送り、サーバーはそれをそのまま保存する","計算はサーバーだけで行い、フロントは金額を一切表示しない","どちらでも同じ結果になるので、実装が楽な方に置けばよい"],answer:0,explain:"フロントのコードと通信内容はユーザーが自由に書き換えられる。だから「1円で購入」と送られても成立してしまう設計は危険で、お金・在庫・権限に関わる判断はサーバーで確定させる（サーバーが唯一の正しい判定者）。一方、入力しながら合計が即座に見えるのは体験として重要なので、フロントでも計算して表示するのは正しい。つまり「表示のための計算」と「確定のための計算」は別物として両方置く。"},
  {lv:3,cat:"全体像 / 登場人物と役割",situation:"「お気に入り登録機能」を新規に作る。画面・API・テーブルすべてが必要。着手順を決めたい。",q:"進め方として最も手戻りが少ないのはどれ？",options:["データの形（何を保存するか）と API の入出力を先に決め、それを契約としてフロントと実装を並行させる","まず画面を完成させ、必要になったデータを見ながら後から API とテーブルを決める","まずテーブルを作り、次に API、最後に画面という順に、前工程が完全に終わってから次へ進む","フロントとサーバーが互いに相談せず作り、結合時に差分を調整する"],answer:0,explain:"一番高い手戻りは「作り終わってからデータ構造が違うと分かる」パターン。だから最初に決めるのは境界の契約（どんな JSON をどの URL で受け渡すか）。契約が決まれば、フロントは仮のデータで先に作れ、サーバーは中身を並行で実装できる。家を建てる前に間取り図を合わせるのと同じで、図面なしで別々に作れば必ず噛み合わない。完全な直列進行は待ち時間が大きく、無相談の並行は結合時に破綻する。"},
  {lv:1,cat:"全体像 / 開発フローとチーム",situation:"多くの現場に「ローカル」「ステージング（検証）」「本番」の3つの環境がある。",q:"それぞれの役割として正しいのはどれ？",options:["ローカル＝自分の手元で自由に壊せる場所、ステージング＝本番に近い構成で最終確認する場所、本番＝実ユーザーが使う場所","ローカル＝個人の練習用、ステージング＝上司がレビューする用、本番＝完成品を置く保管場所","ローカル＝開発用、ステージング＝負荷試験専用、本番＝それ以外すべて","3つとも同じ構成・同じデータで、単にアクセスできる人が違うだけ"],answer:0,explain:"分ける目的は「壊しても実害が出ない場所を確保し、かつ本番に近い状態で検証する」こと。ローカルは失敗コストがゼロなので試行に使い、ステージングは本番と同じ構成・似たデータで「本番でだけ起きる問題」を先に見つける場所。本番は実ユーザーがいるので、確認済みのものだけを入れる。舞台のリハーサルを本番と同じ舞台で行うのと同じ発想。"},
  {lv:1,cat:"全体像 / 開発フローとチーム",situation:"チーム開発では Git によるバージョン管理が前提になっている。",q:"Git が最も効いている場面はどれ？",options:["「いつ・誰が・なぜ変えたか」を残しつつ、複数人の変更を並行して進め、必要なら過去に戻せる","ファイルのバックアップを自動で取り、パソコンが壊れても復旧できるようにする","コードの書き方の誤りを検出して、品質を自動的に担保する","本番サーバーへファイルを転送し、リリースを実行する"],answer:0,explain:"Git の本質は「変更の履歴と分岐を扱えること」。履歴があるから「この行はなぜこうなったか」を後から辿れ（誰かの判断が読める）、分岐があるから他人の作業を止めずに並行できる。バックアップは副次的な効果（リモートに置けば結果的に守られる）で、コード品質の検査は lint、リリースは CI/CD の担当。Git は土台であって、その上に他の仕組みが乗る。"},
  {lv:2,cat:"全体像 / 開発フローとチーム",situation:"要件定義→設計→実装→レビュー→テスト→デプロイ→運用 という流れで進んでいる。ある機能で、実装が終わってレビュー中に「要件の解釈が違う」と判明した。",q:"この事象から得られる教訓として最も適切なのはどれ？",options:["工程が後になるほど手戻りのコストが上がるので、解釈のズレは着手前に小さく確認しておく","レビューは要件の確認には向かないので、レビュー工程では実装の細部だけを見るべきである","要件の解釈違いは避けられないので、実装を早く終わらせて発見を早めるのが唯一の対策である","要件定義の担当者が悪いので、次回から要件書を長く詳細に書けば解決する"],answer:0,explain:"同じ間違いでも、着手前に気づけば会話1回で済むのが、実装後だとコードもテストもやり直しになる。工程が進むほど積み上がったものが増えるからで、これが「早く小さく確認する」が推奨される理由。ビルの土台の寸法違いは基礎工事中なら直せるが、10階まで積んでからでは壊すしかない。ドキュメントを長くしても読まれず伝わらないことは多く、短い確認や小さな試作の方が効く。"},
  {lv:2,cat:"全体像 / 開発フローとチーム",situation:"リポジトリにコードを push すると、自動でテストが走り、成功すれば検証環境へ反映される仕組みが入っている。",q:"CI/CD が解決している問題はどれ？",options:["「壊れた変更が混ざったこと」を人の記憶や善意に頼らず、毎回同じ手順で機械的に検出・反映できるようにする","テストコードを自動生成することで、テストを書く手間そのものを削減する","本番障害を自動で復旧し、サービスの停止時間をゼロにする","コードレビューを不要にして、レビュー待ちの時間を削減する"],answer:0,explain:"人手のリリースは「テスト実行を忘れた」「手順を1つ飛ばした」で壊れる。CI/CD は同じ手順を毎回機械が実行するので、抜けが構造的になくなる（毎回同じ検査を通す工場のライン）。テストを書くのは人間の仕事で、CI はそれを走らせるだけ。障害の自動復旧やレビューの代替でもない。むしろ CI が緑であることを前提に、レビューは設計や意図の議論に集中できるようになる。"},
  {lv:2,cat:"全体像 / 開発フローとチーム",situation:"変更をいきなり main ブランチに入れず、プルリクエスト（PR）を作って他の人に見てもらう運用になっている。",q:"PR の目的として最も本質的なのはどれ？",options:["本番に入る前に「意図と影響範囲」を第三者の目と自動チェックに通し、問題を安く見つける関所を作る","作業した内容を記録として残し、後から誰が何をしたか分かるようにする","変更をまとめてから一括で反映することで、コミット数を減らして履歴をきれいにする","レビュアーに承認責任を移すことで、実装者の責任範囲を限定する"],answer:0,explain:"PR は関所。人（レビュー）と機械（CI）の両方を通すことで、本番に入る前の安いタイミングで問題を捕まえる。特に効くのは「実装は正しいが意図が違う」「影響範囲を見落としている」といった、書いた本人には見えない類の問題。履歴は Git のコミットが担っているし、まとめて一括反映は PR が大きくなりレビュー精度を落とす（小さく分けた方がよい）。責任の移転が目的でもない。"},
  {lv:2,cat:"全体像 / 開発フローとチーム",situation:"DB のパスワードや外部サービスの API キーが必要なアプリを、ローカル・検証・本番の3環境で動かす。",q:"設定値の扱い方として適切なのはどれ？",options:["環境ごとに変わる値と秘密情報は環境変数で外から与え、コードには書かずリポジトリにも入れない","環境ごとに設定ファイルを作り、3つすべてをリポジトリに含めて切り替えて使う","本番の値だけコードに直接書き、ローカルと検証は空文字で動くようにする","秘密情報は暗号化した文字列としてコードに埋め込み、実行時に復号して使う"],answer:0,explain:"原則は「コードは環境に依存しない、違いは外から注入する」。同じ成果物をそのまま3環境で動かせるので、本番だけ挙動が違う事故が減る。加えて秘密情報をリポジトリに置かないのは、履歴に残ると削除しても過去のコミットから復元できるため（一度漏れたら鍵の入れ替えしか手がない）。設定ファイルを全部コミットすると秘密が入り込み、暗号化して埋め込む方式も復号鍵をどこに置くかという同じ問題に戻るだけ。"},
  {lv:3,cat:"全体像 / 開発フローとチーム",situation:"ローカルと検証環境では正常に動く機能が、本番でだけエラーになる。コードは同一のものがデプロイされている。",q:"原因の探し方として最も筋がよいのはどれ？",options:["コードが同じなら差は環境側にあるので、環境変数・データ・権限・外部サービス設定の差分を順に比べる","コードを1行ずつ読み直し、本番でだけ通る分岐がないか探すことに集中する","本番のログは量が多いので、まず検証環境で同じ操作を繰り返して再現を試み続ける","本番の負荷が原因である可能性が高いので、サーバーのスペックを上げて様子を見る"],answer:0,explain:"「同じコード・違う結果」なら、変数は環境側にしかない。だから比較対象を絞って差分を潰す（環境変数の設定漏れ、データ量やデータ内容の違い、権限やネットワーク制限、外部サービスの本番キー設定など）。同じレシピで味が違うなら、材料か調理器具を疑うのと同じ。再現しない環境で試行を続けても情報が増えないし、原因不明のままスペックを上げるのは症状を隠すだけで再発する。"},
  {lv:3,cat:"全体像 / 開発フローとチーム",situation:"20個の変更をまとめた大きなリリースを行ったところ本番で障害が発生した。どの変更が原因か分からず、切り戻しにも時間がかかった。",q:"次回への改善として最も効果が大きいのはどれ？",options:["リリースを小さく分けて回数を増やす。1回の変更点が少なければ原因の特定と切り戻しが速い","リリース前のテスト項目を増やし、network や DB を含めた全パターンを網羅する","リリース作業を経験者だけが行うようにして、作業ミスの可能性を減らす","障害時の連絡体制と手順書を整備し、復旧までの時間を短縮する"],answer:0,explain:"障害ゼロは達成できないので、勝負は「起きたときにどれだけ早く原因を特定して戻せるか」。1回に20個入れると容疑者が20人になるが、1個ずつなら容疑者は1人で、切り戻しも1個戻すだけで済む。荷物を1つの大箱に詰めるか小分けにするかの違い。テストの網羅や手順整備・体制強化も有効だが、「1回の変更量」を減らす方が原因特定・切り戻し・レビュー精度のすべてに同時に効く。"},
  {lv:2,cat:"全体像 / つながりの切り分け",situation:"フォームの保存ボタンを押しても、画面に何の反応もなく保存されていないという報告が来た。",q:"最初に確認すべきことはどれ？",options:["ボタン押下でリクエストが実際に飛んでいるか（Network に行が出るか）を確認する","データベースのテーブルにデータが入っているかを直接確認する","サーバーのアプリケーションログにエラーが出ていないか確認する","ボタンのイベントハンドラのコードを読み直し、実装の誤りを探す"],answer:0,explain:"切り分けの原則は「境界のどちら側で止まったか」を先に決めること。リクエストが飛んでいないならフロント側（ハンドラ未設定、バリデーションで中断、JS エラーで停止）。飛んでいてエラー応答ならサーバー側。この1点で調査範囲が半分になるのに、DB やサーバーログから見始めると、そもそも到達していない場合に無駄な時間を使う。水が出ない蛇口を調べるとき、まず元栓まで水が来ているかを見るのと同じ。"},
  {lv:2,cat:"全体像 / つながりの切り分け",situation:"開発者ツールの Network タブで、失敗した通信の1行をクリックした。",q:"不具合調査で特に見る価値が高い情報の組み合わせはどれ？",options:["ステータスコード・リクエストの送信内容・レスポンスの本文","ファイルサイズ・読み込み優先度・キャッシュの有無","リクエスト元の IP アドレス・接続に使われたプロトコルのバージョン","通信の開始時刻・完了時刻・ウォーターフォールの並び順"],answer:0,explain:"不具合調査で欲しいのは「何を送って、どう断られたか」。ステータスコードで責任の所在（4xx＝リクエスト側、5xx＝サーバー側）が分かり、送信内容で送るデータが正しいか、レスポンス本文でサーバーの言い分（バリデーションエラーの詳細など）が読める。この3つで大半の原因は絞れる。サイズや時刻・優先度は性能改善のときに重要になる情報で、機能が動かない調査では優先度が下がる。"},
  {lv:3,cat:"全体像 / つながりの切り分け",situation:"API がエラーを返している。ステータスコードは 400 番台か 500 番台のどちらかで、対応すべき担当が変わる。",q:"この2つの読み分けとして正しいのはどれ？",options:["4xx＝リクエスト内容に問題があるという主張、5xx＝サーバー側で処理に失敗したという主張","4xx＝軽微なエラー、5xx＝重大なエラーという深刻度の区分","4xx＝フロントの実装バグ、5xx＝インフラの障害という原因の区分","4xx＝再試行すれば直る一時的な失敗、5xx＝再試行しても直らない恒久的な失敗"],answer:0,explain:"番号は「どちら側の問題だとサーバーが判断したか」を表す。4xx は「あなたの送り方がおかしい」（404 不明な URL、401 未認証、422 入力値不正）、5xx は「受け取ったが自分の処理で落ちた」。まず見る場所がフロント寄りかサーバー寄りかが決まるので調査が速い。ただし「フロントのバグ＝4xx」とは限らず、サーバーの検証が厳しすぎて 400 を返している設計ミスもある。深刻度や再試行可否の区分でもない（一時障害は 503 で表す）。"},
  {lv:3,cat:"全体像 / つながりの切り分け",situation:"一覧画面で「表示されている金額が実際と違う」という報告と、「レイアウトが崩れている」という報告が同時に来た。",q:"2つの報告に対する調査の当て方として正しいのはどれ？",options:["金額はデータの流れ（API と DB の値）を、崩れは描画（CSS と画面幅）を見て切り分ける","どちらも画面で起きた問題なので、フロントのコードをまとめて調査する","どちらも同じ画面で起きているので、まず共通する原因（デプロイ失敗）を疑う","レイアウト崩れが先に目に付くので、そちらを直してから金額を確認する"],answer:0,explain:"症状の種類が違えば原因の層も違う。「値が違う」はデータが通る経路（DB→API→フロントの加工）のどこかで変わっているという話で、レスポンス本文を見れば API までは正しいのか判別できる。「崩れている」は同じデータでも見せ方の問題で、CSS や幅の条件を見る。この2つを混ぜて調べると、片方の手がかりでもう片方を誤解する。医者が発熱と骨折を別に診るのと同じで、同時に起きていても系統は分けて当てる。"},
  {lv:3,cat:"全体像 / つながりの切り分け",situation:"ローカルでは API 通信が成功するのに、検証環境にデプロイすると通信がブラウザ側で失敗する。サーバーのログにはリクエストが届いた記録がある。",q:"最も疑わしい原因はどれ？",options:["ブラウザのオリジン制限（CORS）で、サーバーが許可するオリジンに検証環境のドメインが入っていない","サーバーが起動しておらず、リクエストを受け付けられていない","API の URL が間違っていて、存在しないパスを叩いている","データベースへの接続に失敗して、処理が完了できていない"],answer:0,explain:"手がかりは「サーバーには届いている」と「ブラウザ側で失敗」の同時成立。サーバーが処理できているのにブラウザが結果を使えないなら、ブラウザ自身がブロックしている可能性が高く、その代表が CORS（別ドメインへの通信を、サーバーの許可表明がないと使わせない仕組み）。ローカルでは許可設定に入っていたドメインが、検証環境用ドメインでは追加漏れになっている典型パターン。サーバー未起動やパス誤りならログに届いた記録は残らないし、DB 失敗なら 500 として返ってくる。"},
  {lv:3,cat:"全体像 / つながりの切り分け",situation:"ページの表示が体感で遅い。フロント・API・DB のどこに時間がかかっているか特定したい。",q:"原因の層を特定する手順として最も適切なのはどれ？",options:["Network で各通信の所要時間を見て、API が遅いならサーバー側のログや DB のクエリ時間を追う","JavaScript のコードを読み、重い処理がないか目視で探す","画像を圧縮し CSS を軽くするなど、まずフロントの定番改善をすべて適用する","サーバーのスペックを一段上げて、体感が変わるかどうかで判断する"],answer:0,explain:"性能改善は「測ってから直す」が原則。まず Network で内訳を見れば、遅いのが特定の API 応答なのか、画像などの資材の量なのか、それとも受信後の JS 実行なのかが数字で分かる。API が遅いと分かってから、サーバー内で DB のクエリ時間を見る、と段階的に絞る。目視や定番施策の総当たり、スペック増強は、当たれば改善するが外れると時間と費用を捨てるだけで、しかも本当の原因が残る。"},
  {lv:2,cat:"全体像 / つながりの切り分け",situation:"「エラーが出ている」という報告に対して、ログを確認したい。ブラウザのコンソールとサーバーのログのどちらにも情報が出る可能性がある。",q:"2つの違いとして正しいのはどれ？",options:["コンソールはユーザー端末で起きたこと、サーバーログはサーバー内で起きたことが記録される。両方見て初めて全体が分かる","コンソールは開発中のみ、サーバーログは本番のみに出力される","サーバーログはコンソールの内容も含んでいるので、サーバーログだけ見れば足りる","コンソールにはエラー、サーバーログには性能情報が記録されるという役割分担である"],answer:0,explain:"ログは「その場所で起きたこと」しか書けない。ユーザー端末での JS エラーや通信の失敗はブラウザのコンソールにしか出ず、サーバーは自分に届かなかったリクエストを知らない。逆に DB 接続失敗の詳細やスタックトレースはサーバー側にしか出ない。防犯カメラが店内と店外で別なのと同じで、片方だけでは事件の前後が繋がらない。なお端末側のエラーを収集して送る仕組み（エラー監視ツール）を入れると、この片目状態を解消できる。"},
  {lv:1,cat:"サーバー / HTTPとAPI",situation:"API の仕様書に GET / POST / PUT / DELETE といったメソッドが並んでいる。",q:"メソッドの使い分けとして正しいのはどれ？",options:["GET＝取得、POST＝新規作成、PUT＝更新（置き換え）、DELETE＝削除。操作の意図を表す","GET＝データが少ないとき、POST＝データが多いときという、送信サイズによる使い分けである","GET＝画面表示用、POST＝それ以外すべてという2種類の実質的な区分である","GET＝公開データ、POST＝ログインが必要なデータという、権限による使い分けである"],answer:0,explain:"メソッドは「何をしたいか」の宣言。この共通語があるおかげで、URL とメソッドを見れば処理の性質が推測できる。特に重要なのは GET が「取得だけで状態を変えない」という約束であること。ブラウザや CDN は GET をキャッシュしたり自動で再取得したりするので、GET で削除処理を実装すると意図せず消える事故が起きる。サイズや権限で選ぶものではない。"},
  {lv:1,cat:"サーバー / HTTPとAPI",situation:"レスポンスのステータスコードには 200 / 201 / 301 / 400 / 401 / 403 / 404 / 500 などがある。",q:"3桁の最初の数字が表しているものはどれ？",options:["結果の大分類（2xx＝成功、3xx＝転送、4xx＝リクエスト側の問題、5xx＝サーバー側の問題）","処理にかかった時間の目安（数字が大きいほど遅い）","エラーの深刻度を表し、数字が大きいほど対応の優先度が高い","返されるデータの形式（2xx＝JSON、4xx＝HTML など）"],answer:0,explain:"先頭1桁で「どういう結果だったか」の系統が分かる設計になっている。これを覚えるだけで、詳細な番号を知らなくても調査の方向が決まる（4xx なら送った内容を見直す、5xx ならサーバーのログを見る）。荷物追跡の「配達完了／転送中／宛先不明／集配所トラブル」に近い分類。時間・深刻度・形式とは無関係。"},
  {lv:2,cat:"サーバー / HTTPとAPI",situation:"ユーザー一覧を返す API を設計している。REST の考え方に沿った URL にしたい。",q:"URL とメソッドの設計として最も適切なのはどれ？",options:["GET /users で一覧、GET /users/12 で個別、POST /users で作成。URL は「もの」を表し、動作はメソッドで表す","GET /getUsers、GET /getUser?id=12、POST /createUser のように、URL に動作を書いて明示する","POST /api で受け取り、リクエスト本文の type フィールドで処理内容を振り分ける","GET /users_list、GET /user_detail、POST /user_new のように、画面名に対応させる"],answer:0,explain:"REST の要は「URL は名詞（リソース）、動作はメソッド」。/users という住所は1つで、そこに GET すれば見る、POST すれば追加する、という構造にすると規則が読めるので、初見でも推測が効き、キャッシュや権限制御も URL 単位で設計できる。URL に動作を書く方式や単一エンドポイントで振り分ける方式は動くが、規則がないため増えるほど覚えるコストが上がる。画面名に合わせると画面を作り替えるたび API 名が陳腐化する。"},
  {lv:2,cat:"サーバー / HTTPとAPI",situation:"API に POST でデータを送ったところ 415 や 400 が返ってきた。送っている JSON の中身は正しく見える。",q:"確認すべき点として最も適切なのはどれ？",options:["Content-Type ヘッダーが application/json になっているか","JSON のキーの順番が、サーバー側の定義と同じ並びになっているか","本文のサイズが、サーバー側で許可された上限を超えていないか","メソッドを POST 以外（PUT や PATCH）に変えれば通るのかどうか"],answer:0,explain:"HTTP の本文はただのバイト列で、それが JSON なのかフォーム形式なのかはヘッダーで宣言する。宛名なしの小包のようなもので、Content-Type が合わないとサーバーは解釈方法を選べず、パースに失敗して 4xx を返す。JSON のキー順は意味を持たない（順序に依存する実装は誤り）。サイズ超過は 413、メソッド違いは 405 という別の番号で表されるので、まずはヘッダーの宣言を疑うのが筋。"},
  {lv:2,cat:"サーバー / HTTPとAPI",situation:"「べき等（idempotent）」という性質が、API の設計やリトライの議論で出てくる。",q:"べき等性の意味と、それが重要な理由の説明として正しいのはどれ？",options:["同じリクエストを何回送っても結果の状態が変わらない性質。通信が失敗して再送したときに二重登録を防げる","処理が必ず成功する性質。エラーハンドリングを省略できる","複数のリクエストを同時に送っても順番が保たれる性質。並行処理で結果が乱れない","キャッシュが可能な性質。同じリクエストに同じレスポンスを返せる"],answer:0,explain:"通信は失敗する（応答が返る前に切れると、成功したか分からない）。このとき安全に再送できるかどうかを決めるのがべき等性。GET・PUT・DELETE はべき等（同じ削除を2回しても消えている状態は同じ）だが、POST は普通べき等でないので再送すると二重登録になりうる。だから決済のような処理では、リクエストに一意なキーを付けて「同じキーなら2回目は無視」する設計を入れる。成功保証・順序保証・キャッシュ可否とは別の概念。"},
  {lv:2,cat:"サーバー / HTTPとAPI",situation:"一覧 API のレスポンスが 5000 件になり、画面表示も通信も遅くなってきた。",q:"サーバー側の対策として最も標準的なのはどれ？",options:["ページネーション（limit と offset、またはカーソル）で1回の件数を制限する","レスポンスを圧縮してサイズを小さくし、全件を返す方式そのものは維持する","API を分割して、フロントから並列で5本呼び出してもらう","不要なフィールドを削り、1件あたりのデータ量を減らして全件返す"],answer:0,explain:"根本原因は「1回で返す件数に上限がない」こと。件数はデータが増える限り伸びるので、圧縮やフィールド削減で稼げるのは一時的な余裕にすぎず、いずれ同じ壁に当たる。上限を設けて分割取得にすれば、データが100万件になっても1回の負荷は一定に保てる（本のページをめくる形にする）。並列5本は総量が変わらずサーバー負荷は増える。"},
  {lv:3,cat:"サーバー / HTTPとAPI",situation:"クライアントから受け取った値をそのまま DB に保存する API がある。フロント側では入力チェック（必須・形式・桁数）を実装済みである。",q:"サーバー側の入力検証について正しい判断はどれ？",options:["フロントで検証済みでもサーバーで再検証する。API を直接叩けば検証は迂回できる","フロントで検証しているので、サーバーでは検証せず処理速度を優先してよい","サーバー側の検証は型の確認だけ行い、業務ルール（金額の上限など）はフロントに任せる","検証はどちらか一方に統一すべきなので、フロントの検証を削除してサーバーに寄せる"],answer:0,explain:"フロントの検証は「ユーザーに親切に伝えるための機能」で、防御にはならない。API は curl でも直接叩けるし、ブラウザの通信内容も書き換えられるので、サーバーは常に「悪意ある入力が来る」前提で自衛する。空港で搭乗券を自己申告させても、保安検査は必ず実施するのと同じ。両方に置くのは重複ではなく役割が違う（体験のための検証と、守りのための検証）。"},
  {lv:3,cat:"サーバー / HTTPとAPI",situation:"公開済みの API のレスポンスから、使われていないと思われるフィールドを削除したい。利用しているクライアントは自社アプリだけではない可能性がある。",q:"取るべき進め方はどれ？",options:["フィールド削除は利用側を壊す破壊的変更なので、告知期間を設けるかバージョンを分けて移行させる","レスポンスに含まれるだけで害はないので、削除せずそのまま残すのが唯一の正解である","使われていないと判断できた時点で即削除し、問題が起きたら戻す","フィールド名を変更して、旧名を参照しているクライアントに気付かせる"],answer:0,explain:"API は「窓口の契約」なので、返す項目を減らすのは契約違反にあたり、参照している利用側が壊れる。だから削除は、①廃止予告して期間を置く、②/v2 のように新旧を並走させて移行を待つ、のどちらかを取る。鉄道の駅を廃止するには時刻表の改定と告知が必要なのと同じ。放置は正解ではなく（不要なら整理する価値はある）、即削除や改名は利用側に予告なく壊れる形で影響が出るため最も避けたい。"},
  {lv:3,cat:"サーバー / HTTPとAPI",situation:"外部の決済サービスの API を呼び出す処理で、たまにタイムアウトが起きる。呼び出し側の実装を見直したい。",q:"呼び出し側の実装として最も適切なのはどれ？",options:["タイムアウト時間を設定し、失敗時は間隔を空けて数回だけ再試行する。二重決済を防ぐため一意キーを付ける","失敗したら成功するまで即座に再試行を繰り返し、確実に処理を通す","タイムアウトを設定せず、応答が返るまで待ち続けることで取りこぼしを防ぐ","失敗したら即座にエラーを返し、再試行はユーザーに任せる"],answer:0,explain:"外部依存は必ず遅れたり落ちたりする前提で組む。ポイントは3つ。①タイムアウトを切る（待ち続けると自分のサーバーの処理枠を食い潰し、連鎖的に全体が遅くなる）、②再試行は間隔を空けて回数を限る（即時連打は相手をさらに詰まらせる。渋滞にクラクションを鳴らし続けるようなもの）、③再試行が二重決済にならないよう一意キーで冪等にする。ユーザーに丸投げすると同じ操作を繰り返され、結局二重決済のリスクが残る。"},
  {lv:1,cat:"サーバー / データベース",situation:"リレーショナルデータベースのテーブルには、主キー（プライマリキー）を設ける。",q:"主キーの役割として正しいのはどれ？",options:["各行を一意に識別するための列。値は重複せず空にもできないため、行を確実に指し示せる","検索を速くするための列。検索条件に使う列すべてに設定する","並び順を決めるための列。指定しないと行の順序が保証されない","他のテーブルと結合するために必須の列。結合しないテーブルには不要である"],answer:0,explain:"主キーは「行の背番号」。これがあるから「ID 12 のユーザーを更新」と特定でき、同じ人が2行できる（重複）といった破綻を防げる。検索の速さは付随効果で、速くしたい列には別途インデックスを張る。並び順は ORDER BY で明示するものであり主キーが保証するものではない。結合の有無に関わらず、行を特定できないテーブルは更新も削除も安全に行えないため基本的に必要。"},
  {lv:1,cat:"サーバー / データベース",situation:"users テーブルと orders テーブルがあり、orders には user_id 列がある。",q:"外部キー（フォーリンキー）を設定する意味はどれ？",options:["orders.user_id が users に存在する値であることを DB が保証する","2つのテーブルを結合できるようにする。設定しないと JOIN は書けない","user_id での検索を高速にする。インデックスの別名である","users を削除したとき、関連する orders も必ず一緒に削除される"],answer:0,explain:"外部キーの本質は「参照先が存在することの保証（参照整合性）」。アプリのバグで存在しないユーザー ID を書き込もうとしても DB が拒否するので、宛先不明の注文という矛盾データが生まれない。台帳の相互チェックのような役割。JOIN は外部キーがなくても書ける（保証がないだけ）。インデックスは別概念（ただし多くの DB では外部キー列にインデックスを張るのが定石）。連動削除は ON DELETE CASCADE を明示した場合の挙動で、既定ではむしろ削除が拒否される。"},
  {lv:2,cat:"サーバー / データベース",situation:"100万件のテーブルに対する「email が一致する行を1件取る」という検索が数秒かかっている。",q:"最も効果が大きい対策はどれ？",options:["email 列にインデックスを作成し、全件走査（フルスキャン）を避ける","サーバーのメモリを増やして、テーブル全体をキャッシュに載せる","SELECT * をやめて必要な列だけ取得し、転送量を減らす","テーブルを分割して、1テーブルあたりの件数を減らす"],answer:0,explain:"インデックスは本の索引。無ければ1ページ目から全部読む（フルスキャン）ので件数に比例して遅くなるが、索引があれば数回の探索で目的の行に届く。100万件なら劇的に変わる。メモリ増強は全件読む速度が上がるだけで根本は同じ、列を絞るのは転送量の話で検索時間には効きにくい、テーブル分割は運用が複雑化する重い手段。まず索引を疑うのが定石。"},
  {lv:2,cat:"サーバー / データベース",situation:"インデックスは検索を速くするが、すべての列に付ければよいというわけではない。",q:"インデックスの代償として正しいのはどれ？",options:["登録・更新・削除のたびに索引の更新も必要になるため書き込みが遅くなり、ディスク容量も消費する","検索結果の正確さが落ちることがあり、件数がずれる可能性がある","テーブルのロック時間が常に長くなり、同時アクセスができなくなる","主キーと競合してしまい、主キーによる検索がかえって遅くなる"],answer:0,explain:"索引は「別に持っている並べ替え済みの目次」なので、本体を書き換えるたびに目次も直さなければならない。だから読み取りは速くなるが、書き込みは遅くなり容量も増える。本に索引を10種類付けたら、内容を1行直すたび全部の索引を修正するのと同じ。結果の正確さは変わらず、常にロックが伸びるわけでも主キーと競合するわけでもない。使う検索に合わせて必要な分だけ張るのが正解。"},
  {lv:2,cat:"サーバー / データベース",situation:"銀行口座間の送金処理で、A の残高を減らし B の残高を増やす。この2つの更新の途中でエラーが起きる可能性がある。",q:"トランザクションを使う理由として正しいのはどれ？",options:["複数の更新を「全部成功か、全部取り消し」の一塊として扱い、途中で失敗しても中途半端な状態を残さない","更新を高速化するために、複数のクエリをまとめて1回で送信できる","同じデータを複数のユーザーが同時に読めるようにして、待ち時間を減らせる","更新の履歴が自動で保存され、後から任意の時点の状態に戻せる"],answer:0,explain:"分けて実行すると「A から引いたが B に入っていない」という消失が起こりうる。トランザクションは複数の操作を一括の約束にする仕組みで、コミットすれば全部確定、ロールバックすれば全部無かったことになる（原子性）。荷物の受け渡しで、渡し終わるまでどちらの手も離さないイメージ。高速化や同時読み取りが目的ではなく、任意時点への巻き戻しはバックアップの領域。"},
  {lv:3,cat:"サーバー / データベース",situation:"ブログ記事の一覧を表示する API が遅い。ログを見ると、記事一覧を取る SQL が1回、その後に著者名を取る SQL が記事数と同じ回数だけ実行されている。",q:"この状態の名称と対策として正しいのはどれ？",options:["N+1 問題。JOIN や一括取得（IN 句・eager loading）でまとめて取る","デッドロック。ロックの取得順を統一して待ち合わせを解消する","フルスキャン。著者テーブルにインデックスを張って1件あたりを速くする","コネクションリーク。接続を確実に閉じて接続数の枯渇を防ぐ"],answer:0,explain:"1回＋N回で N+1 問題。1件あたりのクエリが速くてもクエリ回数が件数に比例するため、往復のオーバーヘッドが積み上がって遅くなる（20人分の買い物を20回スーパーに往復する状態）。対策は「まとめて1回で取る」こと。JOIN するか、記事の著者 ID を集めて IN 句で一括取得する。ORM を使っているときは eager loading の指定が抜けているのが典型原因。インデックス追加は1件あたりを速くするだけで往復回数は減らない。"},
  {lv:3,cat:"サーバー / データベース",situation:"稼働中のサービスで、users テーブルに必須の新しい列を追加したい。既存データは100万件ある。",q:"進め方として最もリスクが低いのはどれ？",options:["まず NULL 許容（または既定値つき）で列を追加し、既存データを埋め、コードの対応が終わってから必須制約を付ける","最初から NOT NULL 制約付きで列を追加し、失敗したらロールバックして再検討する","テーブルを作り直して新しい定義にし、データを移行してから切り替える","アプリ側で必須扱いにすれば十分なので、DB には制約を付けずに運用する"],answer:0,explain:"構造変更(マイグレーション)は段階を分ける。既存行があるテーブルにいきなり必須列は入らない（既存行の値が決まらないため失敗するか、長時間ロックする）。だから段階を分ける。①緩い定義で列を作る（既存に影響なし）→②値を埋める→③新旧コードが並走できる状態を作る→④最後に制約を締める。橋を架け替えるとき仮橋を通してから旧橋を落とすのと同じ。作り直しと移行は停止時間とリスクが大きく、制約を付けない運用は不正データの流入を許す。"},
  {lv:3,cat:"サーバー / データベース",situation:"SQL のリクエストが増え、DB がボトルネックになってきた。参照（読み取り）が全体の9割を占めている。",q:"対策の順序として最も適切なのはどれ？",options:["まず遅いクエリの特定とインデックス見直しを行い、足りなければキャッシュやレプリカを検討する","まずレプリカを増やして読み取りを分散させ、その後にクエリを最適化する","まず DB のスペックを最大まで上げ、限界に達してから設計を見直す","まずアプリ側に全件キャッシュを持たせ、DB へのアクセスをほぼゼロにする"],answer:0,explain:"順序が重要。1本の非効率なクエリが負荷の大半を作っていることは珍しくなく、その場合インデックス1つで問題が消える。先にレプリカやスペック増強をすると、非効率をそのまま増幅して費用だけが増える（水漏れを直さずポンプを増やす状態）。まず測って直し、それでも構造的に足りないと分かってから分散やキャッシュへ進む。全件キャッシュは更新反映の難しさ（古いデータを配る）という新しい問題を生む。"},
  {lv:1,cat:"サーバー / 実行環境とインフラ",situation:"「Web サーバー」と「アプリケーションサーバー」という言葉が別のものとして出てくる。",q:"役割の違いとして適切なのはどれ？",options:["Web サーバーは受信・静的ファイル配信・振り分けを担い、アプリケーションサーバーは書いたコードを実行して動的な結果を作る","Web サーバーは本番用、アプリケーションサーバーは開発用という用途の違いである","Web サーバーは HTTP を扱い、アプリケーションサーバーはデータベース接続を専門に扱う","2つは同じものを指す別名にすぎず、実体や役割としての違いはない"],answer:0,explain:"入口の受付と、奥の調理場という分担。受付（Nginx など）はリクエストを受け、画像や CSS のような置いてあるものはその場で返し、処理が必要なものだけ奥へ回す。奥（アプリケーションサーバー）が自作コードを実行して HTML や JSON を作る。分けることで、受付側で TLS 終端・圧縮・振り分け・流量制限などをまとめて処理でき、アプリは業務処理に集中できる。開発・本番の区分ではなく、DB 接続はアプリ側が行う。"},
  {lv:1,cat:"サーバー / 実行環境とインフラ",situation:"ローカルで開発サーバーを起動すると http://localhost:3000 でアクセスできる。別のアプリを起動したら「ポートが使用中」と出た。",q:"ポート番号の役割として正しいのはどれ？",options:["同じマシン上で複数のプログラムの宛先を区別する番号。1つのポートは1つが使う","通信の速度の上限を決める番号で、大きいほど高速に通信できる","アクセスを許可するユーザー数の上限を表す番号である","プログラムの起動順を表す番号で、先に起動したものから順に振られる"],answer:0,explain:"IP アドレスがマンションの住所、ポートは部屋番号。同じサーバーに Web、DB、管理画面が同居していても、番号で宛先を分けられる。1つの部屋に2世帯は入れないので、同じポートを2つのプログラムが同時に使おうとすると衝突エラーになる（この場合は別のポートを使うか、先のプロセスを止める）。速度・ユーザー数・起動順とは無関係。"},
  {lv:2,cat:"サーバー / 実行環境とインフラ",situation:"「自分の環境では動くのに、他の人の環境では動かない」が繰り返し起きる。Docker の導入が提案された。",q:"コンテナが解決する問題はどれ？",options:["OS・言語のバージョン・ライブラリ・設定をひとまとめに固めて配れるので、どのマシンでも同じ環境で動かせる","1台のサーバーで複数のアプリを動かせるようになり、サーバー費用を削減できる","アプリの実行速度が向上し、同じスペックでより多くのリクエストを処理できる","ソースコードを暗号化して配布でき、実装内容を隠せるようになる"],answer:0,explain:"「動かない」の原因はたいてい環境差（Node のバージョン違い、入っていないライブラリ、OS 依存の挙動）。コンテナは実行環境ごと箱に詰めて持ち運べるようにするので、開発・検証・本番・新メンバーの端末まで同じ箱を使えて差がなくなる。引っ越しのとき部屋ごと運ぶイメージ。1台に複数同居や集約は副次的な利点で、速度が上がるわけでもコードが隠れるわけでもない。"},
  {lv:2,cat:"サーバー / 実行環境とインフラ",situation:"アクセスが増えてサーバー1台では処理しきれなくなった。スケールアップとスケールアウトのどちらを取るか議論している。",q:"2つの違いと選択の考え方として正しいのはどれ？",options:["アップ＝1台を強くする（限界があるが単純）、アウト＝台数を増やす（伸ばしやすいが状態の持ち方に設計が必要）","アップ＝費用が高い方式、アウト＝費用が安い方式という区分である","アップ＝一時的な対処、アウト＝恒久対策であり、常にアウトを選ぶべきである","アップ＝CPU を増やすこと、アウト＝メモリを増やすことを指す"],answer:0,explain:"アップは机を大きくする、アウトは机を増やす。アップは変更が少なく手早いが、1台の上限とその1台が落ちたら止まる（単一障害点）という限界がある。アウトは理屈上いくらでも伸ばせるが、セッションやアップロードファイルを特定の1台に持っていると台を増やした瞬間に破綻するので、状態を外（DB やストレージ）へ出す設計が前提になる。費用の高低や新旧の優劣ではなく、どちらもトレードオフ。"},
  {lv:2,cat:"サーバー / 実行環境とインフラ",situation:"サーバーレス（AWS Lambda、Vercel Functions など）でのバックエンド構築を検討している。",q:"サーバーレスの特徴として正しいのはどれ？",options:["リクエストが来たときだけ起動して終了する。使った分だけ課金されるが起動待ちや実行時間の上限がある","サーバーが存在しないため障害が起きず、可用性を考える必要がなくなる","常時稼働のサーバーより必ず安く、規模が大きくなるほど費用対効果が高くなる","状態をメモリに保持できるので、セッション管理を簡単に実装できる"],answer:0,explain:"サーバーレスは「サーバーが無い」のではなく「自分で管理しない」。使うときだけ起動する貸し会議室のような形なので、アクセスが少ない・波があるサービスでは待機コストが消えて有利。一方で、しばらく使われないと起動に時間がかかる（コールドスタート）、1回の実行時間に上限がある、処理ごとに状態が消えるためメモリに情報を持てない、という制約がある。常時大量アクセスなら常駐サーバーの方が安くなることも多い。"},
  {lv:3,cat:"サーバー / 実行環境とインフラ",situation:"サーバーを2台に増やしたところ、ログイン状態が頻繁に切れる不具合が発生した。ログイン情報はアプリのメモリ上にセッションとして保持している。",q:"原因と対策として正しいのはどれ？",options:["振り分け先の台によってセッションを持っていないため。セッションを DB や Redis など共有の場所へ移す","2台のサーバーの時刻がずれているため。時刻同期を設定して有効期限の判定を揃える","ロードバランサーの設定が誤っているため。振り分けをやめて1台に戻す","セッションの有効期限が短すぎるため。期限を延ばして切れないようにする"],answer:0,explain:"メモリ上のセッションはその台だけの記憶。1台目でログインしても、次のリクエストが2台目に振られると「知らない人」になる。窓口ごとに別の台帳を持っている状態。対策は台帳を1つの共有場所（DB や Redis）に置くこと。これで何台に増えても一貫する。1台に戻すのは増設の目的を捨てることになり、期限延長は症状を薄めるだけで根本原因が残る（時刻ずれは別問題として起こりうるが、この症状の主因ではない）。"},
  {lv:3,cat:"サーバー / 実行環境とインフラ",situation:"本番のエラーに気付くのが「ユーザーからの問い合わせ」になっている。監視の仕組みを整えたい。",q:"最初に入れるべきものとして最も効果的なのはどれ？",options:["エラーの発生を検知して通知する仕組みと、リクエストの成否・応答時間を残すログ。まず「起きたことが分かる」状態を作る","CPU・メモリのグラフを常時表示するダッシュボードを整備し、毎朝目視で確認する","すべてのリクエストの詳細を全文ログに残し、後から完全に追跡できるようにする","負荷試験を定期実行して、性能の劣化を事前に検知できるようにする"],answer:0,explain:"監視の第一歩は「気付ける」こと。エラー通知があれば発生から数分で分かり、ログがあれば何が起きたか追える。この2つが無いと他の情報が揃っても対応が始まらない。火災報知器を付けてから消火設備を考える順序。CPU グラフは原因調査に役立つが、それ自体はユーザーの失敗を教えてくれない。全文ログは費用と個人情報の問題を招きやすく、負荷試験は予防策で発生検知にはならない。"},
  {lv:3,cat:"サーバー / 実行環境とインフラ",situation:"インフラの構成（サーバー、ネットワーク、権限）を管理コンソールで手作業で作ってきた。同じ構成の検証環境を新たに作る必要が出た。",q:"Terraform などの IaC（Infrastructure as Code）を使う利点はどれ？",options:["構成をコードで定義するので、同じ環境を再現でき、変更履歴をレビューでき、差分を事前に確認できる","クラウドの利用料金が自動で最適化され、無駄なリソースが削除される","手作業より短時間でサーバーを起動でき、起動速度そのものが向上する","インフラの障害を自動で検知して復旧する仕組みが付属する"],answer:0,explain:"手作業の構成は「作った人の記憶」にしか残らず、再現できず、いつ誰が何を変えたかも追えない。コードにすると、同じ定義から同じ環境を何度でも作れ、Git で履歴とレビューが効き、適用前に差分（何が作られ何が消えるか）を確認できる。料理を勘でやるかレシピを書くかの違い。費用最適化・起動高速化・自動復旧は IaC の機能ではない（別の仕組みで対応する）。"},
  {lv:1,cat:"サーバー / ネットワークとDNS",situation:"新しいドメインを取得し、自分のサーバーで公開したい。DNS の設定が必要と言われた。",q:"DNS レコードの役割として正しいのはどれ？",options:["ドメイン名と実際の接続先（IP アドレスや別のドメイン名）の対応表を公開する","ドメインの所有者情報を登録し、他人が同じ名前を使えないようにする","サーバーへの通信を暗号化し、盗聴を防ぐ","アクセスを地域ごとに振り分け、近いサーバーへ誘導する"],answer:0,explain:"DNS はインターネットの電話帳で、レコードは1件1件の掲載内容。A レコードなら「この名前は 203.0.113.10」、CNAME なら「この名前は別のあの名前と同じ場所」を意味する。ここが未設定・誤設定だと、サーバーが正常でも誰も辿り着けない。所有権の登録はドメイン登録（レジストラ）側の話、暗号化は TLS、地域振り分けは DNS で実現する応用の一種であって基本的な役割ではない。"},
  {lv:1,cat:"サーバー / ネットワークとDNS",situation:"サイトを HTTPS で公開する準備をしている。",q:"HTTPS にすることで得られるものとして正しいのはどれ？",options:["通信内容の暗号化（盗聴防止）、改ざん検知、接続先が本物であることの確認","サーバーの処理速度の向上と、通信量の削減","サイト内のデータが自動的にバックアップされること","サーバーへの不正アクセスやパスワード漏洩の防止"],answer:0,explain:"HTTPS が守るのは「通信の途中」。カフェの Wi-Fi で他人にパスワードを覗かれない（暗号化）、途中で内容を書き換えられない（改ざん検知）、偽サイトに繋がされていない（サーバー証明書による本人確認）。中身が見えない封筒で送るイメージ。一方、サーバーそのものの守りやアプリの脆弱性は HTTPS の対象外なので、別に対策が必要。速度やバックアップとも無関係（HTTP/2 などで速くなる面はあるが HTTPS の目的ではない）。"},
  {lv:2,cat:"サーバー / ネットワークとDNS",situation:"DNS の設定を変更したが、自分の端末では新しい接続先にならず、古いサーバーへ繋がり続ける。同僚の端末では新しい方に繋がっている。",q:"最も可能性が高い原因はどれ？",options:["DNS の応答が TTL の期間キャッシュされ、端末や DNS サーバーに古い情報が残っている","DNS レコードの設定内容が間違っていて、反映自体が行われていない","サーバーの証明書が新しいドメインに対応しておらず、接続が拒否されている","ドメインの有効期限が切れており、名前解決ができなくなっている"],answer:0,explain:"DNS の応答には「この情報は何秒間使ってよい」という有効期間（TTL）があり、その間は問い合わせ側が結果を持ち回る。だから変更直後は、キャッシュが切れた人から順に新しい方へ移る（人によって見え方が違う移行期間が生まれる）。同僚が新しい方に繋がっているなら設定自体は正しく反映されているので、設定ミス・証明書・期限切れは除外できる。切り替え予定があるときは事前に TTL を短くしておくのが定石。"},
  {lv:2,cat:"サーバー / ネットワークとDNS",situation:"複数のサーバーの前段にロードバランサーを置いている。",q:"ロードバランサーの役割として正しいのはどれ？",options:["リクエストを複数のサーバーへ振り分け、応答しないサーバーを検知して振り分け対象から外す","リクエストを一時的に保管し、サーバーが空いたときに順次流すキューとして働く","サーバー内の処理を並列化して、1リクエストの処理を高速にする","データベースへの接続を集約して、接続数の上限を管理する"],answer:0,explain:"受付で行列を複数の窓口に割り振る係。負荷を分散するだけでなく、定期的に各サーバーの生存確認（ヘルスチェック）を行い、落ちた台へは送らないので、1台の障害でサービス全体が止まらない。この2つが主役割。キューは別の仕組み（メッセージキュー）、1リクエストの高速化はアプリ側の話、DB 接続の集約はコネクションプールが担う。"},
  {lv:3,cat:"サーバー / ネットワークとDNS",situation:"「サイトに繋がらない」という報告。DNS は正しく引けており、サーバーのプロセスも起動していることを確認した。",q:"次に確認すべき点として最も適切なのはどれ？",options:["ファイアウォールやセキュリティグループで、該当ポートへの通信が許可されているか","サーバー内のアプリケーションログにエラーが出ていないか","DNS レコードの TTL が短すぎないか","データベースへの接続設定が正しく、接続できているか"],answer:0,explain:"通信は「名前解決→接続→リクエスト→処理」の順に進む。名前は引けていて、プロセスも生きている。それでも繋がらないなら、疑うのは名前と処理の間、すなわち経路が開いているか。ファイアウォールやクラウドのセキュリティグループでポートが閉じていると、正しい住所に着いても門が閉まっている状態になる。アプリのログや DB 設定はリクエストが届いた後の話なので、届いていない段階では手がかりが出ない。"},
  {lv:3,cat:"サーバー / ネットワークとDNS",situation:"サーバーへのログインに SSH 鍵を使う。秘密鍵と公開鍵の2つが登場する。",q:"扱い方として正しいのはどれ？",options:["公開鍵をサーバーに登録し、秘密鍵は自分の手元だけに置く。秘密鍵は共有せず、漏れたら鍵を作り直す","秘密鍵をサーバーに登録し、公開鍵を自分の手元に置く","秘密鍵をチームで共有し、全員が同じ鍵でログインできるようにする","公開鍵はリポジトリで管理し、秘密鍵は暗号化してリポジトリに含める"],answer:0,explain:"公開鍵は「この鍵で開く錠を付けておいて」という錠側、秘密鍵は自分だけが持つ鍵。だから公開鍵はサーバーに置いて問題なく（公開されても危険はない）、秘密鍵は絶対に配らない。鍵を共有すると誰の操作か分からなくなり、1人が退職しても回収できない。リポジトリに秘密鍵を入れるのは最悪で、履歴に残るため後から消しても復元できてしまう。漏れた場合の正しい対応は鍵の作り直しと登録の差し替え。"},
  {lv:2,cat:"サーバー / ネットワークとDNS",situation:"「オリジン」という言葉が CORS やセキュリティの文脈で出てくる。",q:"オリジンの定義として正しいのはどれ？",options:["スキーム（http/https）・ホスト名・ポート番号の3点セット。1つでも違えば別のオリジンとして扱われる","ドメイン名のこと。スキームやポート、パスは含まない","IP アドレスのこと。同じサーバーなら同じオリジンになる","サービスを提供している組織の単位。同じ会社のサイトは同一オリジンになる"],answer:0,explain:"ブラウザのセキュリティの多くはこの3点セットが同じかどうかで判断される。だから https://example.com と http://example.com は別、:3000 と :8080 も別。この厳しさが、悪意あるサイトから他サイトのデータを勝手に読み取られるのを防いでいる。逆に「同じ会社だから通るはず」という感覚で組むと CORS のエラーに当たる（サーバー側で明示的に許可を表明する必要がある）。同一 IP でもホスト名やポートが違えば別オリジン。"},
  {lv:1,cat:"サーバー / 認証とセキュリティ",situation:"「認証（Authentication）」と「認可（Authorization）」は別の概念として扱われる。",q:"違いの説明として正しいのはどれ？",options:["認証＝誰であるかを確かめること、認可＝その人に何を許すかを決めること","認証＝ログイン画面の処理、認可＝ログアウト処理という工程の違い","認証＝パスワードによる確認、認可＝二要素認証による強化された確認","認証＝サーバー側の処理、認可＝フロント側の処理という担当の違い"],answer:0,explain:"認証は本人確認（受付で身分証を見せる）、認可は権限の判定（そのフロアに入れるか）。順番は認証→認可で、両方必要。混同すると「ログインしていれば何でもできる」という設計になり、他人の注文を ID を変えるだけで見られる、といった事故に繋がる。ログイン済みかどうかと、その人がその操作をしてよいかは、必ず別に判定する。"},
  {lv:1,cat:"サーバー / 認証とセキュリティ",situation:"ユーザーのパスワードをデータベースに保存する実装を検討している。",q:"保存方法として適切なのはどれ？",options:["bcrypt などのパスワード用ハッシュ関数で不可逆に変換して保存する","可逆な暗号化を施して保存し、必要なときに復号して平文と比較する","平文で保存するが、DB へのアクセス権限を厳しく制限して守る","短い固定の変換規則を自作して保存し、規則自体を秘密にする"],answer:0,explain:"原則は「元に戻せない形で保存する」。ハッシュは一方通行の変換なので、DB が漏れてもパスワード自体は取り出せない。さらに bcrypt などのパスワード専用関数は、1回の計算をあえて重くして総当たり攻撃を実用的でなくし、同じパスワードでも別のハッシュになる仕組み（ソルト）を含む。可逆な暗号化は復号鍵が漏れれば全滅、平文はアクセス制御が破られた瞬間に全滅、自作規則は解析されれば終わりで、いずれも「漏れた後」に耐えられない。"},
  {lv:2,cat:"サーバー / 認証とセキュリティ",situation:"ログイン状態の保持方法として、セッション方式（サーバーに状態を持ちセッション ID を Cookie で渡す）と JWT 方式（署名付きトークンをクライアントが持つ）を比較している。",q:"違いの理解として正しいのはどれ？",options:["セッションは即時無効化しやすいがサーバー側に状態が必要。JWT は状態が不要で分散に向くが、発行済みトークンの即時失効が難しい","セッションは古い技術で安全性が低く、JWT は新しく安全性が高い","JWT は暗号化されているため、中身を第三者が読むことはできない","セッションは Cookie を使うため CSRF に弱く、JWT を使えば CSRF 対策は不要になる"],answer:0,explain:"トレードオフは「状態をどこに置くか」。セッションはサーバーが台帳を持つので、削除すれば即ログアウトさせられるが、複数台構成では台帳の共有が必要。JWT は本人証明を持ち歩く形なのでサーバーが台帳を持たずに済む反面、渡した通行証を後から無効にするのが難しく、有効期限を短くする・失効リストを持つといった追加設計が必要。新旧の優劣ではない。JWT は署名（改ざん検知）であって暗号化ではないので中身は読めるし、保存先を Cookie にすれば CSRF 対策は依然必要。"},
  {lv:2,cat:"サーバー / 認証とセキュリティ",situation:"検索フォームの入力値を、そのまま文字列連結して SQL を組み立てている実装を見つけた。",q:"リスクと対策として正しいのはどれ？",options:["SQL インジェクションの危険がある。プレースホルダ（パラメータ化クエリ）を使う","文字数超過でエラーになる危険がある。入力の最大長を制限する","日本語が文字化けする危険がある。文字コードを統一する","検索が遅くなる危険がある。インデックスを追加して対処する"],answer:0,explain:"文字列連結では、入力値が SQL の一部として解釈されうる。悪意ある入力で条件を書き換えたりテーブルを削除されたりできる（宅配便の宛名欄に指示を書き込まれて、配達員がそれに従ってしまう状態）。対策は、値を値としてしか扱わないプレースホルダを使うこと。入力値のエスケープを自作したり禁止文字を弾くブラックリスト方式は抜け漏れが出やすく、根本解決にならない。文字数・文字コード・性能は別の論点。"},
  {lv:2,cat:"サーバー / 認証とセキュリティ",situation:"ユーザーが投稿したコメントを、そのまま HTML に埋め込んで表示している。",q:"起こりうる問題と対策として正しいのはどれ？",options:["XSS の危険がある。表示時にエスケープし、HTML を許可する場合はサニタイズする","文字数が多いとレイアウトが崩れる。表示文字数を制限する","改行が反映されない。改行文字を br タグに変換する","絵文字が表示されない。文字コードを 4 バイト対応にする"],answer:0,explain:"投稿内容に script タグやイベント属性が含まれると、それを見た他のユーザーのブラウザで実行され、Cookie やトークンを盗まれる。対策は「文字として表示する」こと、つまり記号を実体参照へ変換するエスケープ。多くのフレームワークは既定でエスケープするので、それを外す機能（危険な HTML 挿入）を使うときだけ要注意になる。装飾入力を許したいなら、許可するタグだけを残すサニタイズを専用ライブラリで行う。他の選択肢は表示上の不便であって攻撃には繋がらない。"},
  {lv:3,cat:"サーバー / 認証とセキュリティ",situation:"ログイン中のユーザーが、悪意あるサイトを開いただけで、意図しない送金や設定変更が行われてしまう攻撃がある。",q:"この攻撃の名称と対策として正しいのはどれ？",options:["CSRF。リクエストのトークン検証や Cookie の SameSite 属性で防ぐ","XSS。表示時に入力値をエスケープして防ぐ","SQL インジェクション。プレースホルダを使って防ぐ","総当たり攻撃。ログインの試行回数を制限して防ぐ"],answer:0,explain:"Cookie はそのドメイン宛のリクエストに自動で付く。この性質を悪用し、攻撃者のページから被害者のブラウザ経由で本物のサイトへリクエストを飛ばすのが CSRF。本人の意思ではないのに、身分証が自動で提示されてしまう状態。対策は「その画面から送られた正当なリクエストか」を確かめること（フォームに埋め込んだトークンの照合）と、Cookie に SameSite を設定して他サイト起点では送らせないこと。他の選択肢は別の攻撃への対策。"},
  {lv:3,cat:"サーバー / 認証とセキュリティ",situation:"注文詳細 API が /orders/1234 という URL で提供されている。ログイン済みユーザーがこの ID を書き換えると、他人の注文が見えてしまった。",q:"この問題の本質と対策として正しいのはどれ？",options:["認可の欠落。ログイン済みかだけでなく、その注文がそのユーザーのものかをサーバー側で毎回検証する","URL に ID を出しているのが原因。ID を推測されにくいランダム値に変えて隠す","フロントの実装漏れ。他人の ID を入力できないよう画面側で制限する","通信の暗号化不足。HTTPS を有効にして ID を盗まれないようにする"],answer:0,explain:"典型的な認可漏れ（他人の資源を触れてしまう脆弱性）。認証は通っているので「誰か」は分かっているが、「その人がその注文を見てよいか」を判定していない。対策はサーバー側で毎回所有者を照合すること（WHERE 句にユーザー ID を必ず含める、など）。ID をランダム化するのは推測を難しくするだけで、漏れた ID や共有された URL では突破される（隠すことによる守りは本質的な対策にならない）。フロントの制限は API を直接叩けば無効、HTTPS は経路の保護であって権限の話ではない。"},
  {lv:3,cat:"サーバー / 認証とセキュリティ",situation:"API キーを誤ってリポジトリにコミットして push してしまった。すぐに該当行を削除する修正コミットを積んだ。",q:"取るべき対応として正しいのはどれ？",options:["漏れた鍵を無効化して新しい鍵に差し替える。履歴から辿れるため、削除コミットだけでは漏洩は解消しない","削除コミットで最新の状態からは消えているため、これで対応は完了である","リポジトリをプライベートに変更すれば、外部から見えなくなるので問題ない","該当ファイルを .gitignore に追加し、以後コミットされないようにすれば十分である"],answer:0,explain:"Git は履歴を保持するので、最新から消しても過去のコミットを見れば値が読める。さらに公開リポジトリなら push した時点でクローンやクローラに取得されている可能性があり、後から履歴を書き換えても手遅れになりうる。だから前提は「一度出たら漏洩した」と扱い、鍵の無効化と再発行（ローテーション）を行う。家の鍵を落としたら、鍵を拾い直すのではなく錠を交換するのと同じ。.gitignore や公開範囲の変更は再発防止であって、既に漏れた鍵の危険は消えない。"},
  {lv:1,cat:"フロント / ブラウザの仕組み",situation:"ブラウザが HTML を受け取ると DOM を組み立てる。開発者ツールの Elements タブに表示されるのもこの DOM である。",q:"DOM の説明として正しいのはどれ？",options:["HTML を解析して作られる、JavaScript から操作できる木構造の表現。画面の実体はこれである","サーバーから送られてきた HTML ファイルそのもの。中身は常にファイルと一致する","CSS の適用結果をまとめた表で、要素のスタイルを保持している","ブラウザが画面を描画するために使う画像データの集合である"],answer:0,explain:"DOM は HTML を元にブラウザが組み立てた「操作できる部品表」。木構造なので親子や兄弟を辿れ、JavaScript から要素を追加・削除・書き換えできる。重要なのは、元の HTML ファイルとは別物であること。JS で書き換えれば DOM だけが変わる（だから Elements タブの内容とページのソース表示は一致しないことがある）。スタイルの表は CSSOM、描画結果はさらに後の工程。"},
  {lv:1,cat:"フロント / ブラウザの仕組み",situation:"開発者ツールにはいくつかのタブがある。調査目的に応じて見る場所が変わる。",q:"タブの用途の組み合わせとして正しいのはどれ？",options:["Elements＝DOM とスタイルの確認、Console＝JS のエラーとログ、Network＝通信の内容と時間","Elements＝ファイル一覧、Console＝サーバーへのコマンド入力、Network＝回線速度の測定","Elements＝HTML の編集と保存、Console＝コードの実行結果の永続化、Network＝API 仕様の確認","Elements＝レンダリング性能の測定、Console＝メモリ使用量の確認、Network＝キャッシュの削除"],answer:0,explain:"この3つで大半の調査は足りる。表示が変（要素はあるか、どの CSS が勝っているか）なら Elements、動かない（JS が例外で止まっていないか）なら Console、データが来ない（ステータス・送信内容・応答）なら Network。まずどのタブを開くかを症状から選べるようになると、調査時間が大きく縮む。なお Elements での編集はその場限りでファイルには保存されない。"},
  {lv:2,cat:"フロント / ブラウザの仕組み",situation:"ページの表示は「HTML 解析→スタイル計算→レイアウト→描画」という段階を経る。JavaScript で要素の幅を変更すると、この工程の一部がやり直される。",q:"パフォーマンスの観点で正しい理解はどれ？",options:["位置やサイズの変更はレイアウトの再計算を招くため重い。色や透明度の変更に留められれば軽く済む","DOM を操作する回数ではなく、操作するコードの行数が処理時間を決める","JavaScript の実行はレンダリングと並行して行われるため、表示に影響しない","要素を非表示にすればレイアウト計算の対象から外れるため、常に display:none を使うべきである"],answer:0,explain:"幅や位置を変えると、周りの要素の配置まで計算し直す必要がある（本のレイアウトを変えたら以降のページ全部を組み直すのと同じ）。一方 opacity や transform による見た目の変化は、配置の計算をやり直さずに済むため軽い。だからアニメーションは transform/opacity で作るのが定石。また JS の実行と描画は同じスレッドで行われるため、重い JS は表示を止める。display:none は用途が別で、常用する話ではない。"},
  {lv:2,cat:"フロント / ブラウザの仕組み",situation:"HTML の中で script タグを読み込む位置や属性（async / defer）によって、表示のタイミングが変わる。",q:"defer を付けた場合の挙動として正しいのはどれ？",options:["HTML の解析を止めずにダウンロードし、解析完了後に、記述順を守って実行される","ダウンロード完了と同時に、HTML の解析を中断して即座に実行される","HTML の解析が終わるまでダウンロードを開始しない","ユーザーの操作があるまで実行が保留される"],answer:0,explain:"何も付けない script は、出会った時点で解析を止めて取得・実行する（表示が止まる原因になる）。defer は「取得は並行、実行は解析後、順番は保つ」ので、DOM が揃った前提のコードを安全に後回しできる。async も並行取得だが、取れた順に即実行するため順序が保証されない（他に依存しない独立したスクリプト向け）。この違いを知っていると、表示速度と「要素が見つからないエラー」の両方を扱える。"},
  {lv:2,cat:"フロント / ブラウザの仕組み",situation:"JavaScript から localStorage、sessionStorage、Cookie にデータを保存できる。",q:"使い分けとして正しいのはどれ？",options:["localStorage＝端末に残る、sessionStorage＝タブを閉じると消える、Cookie＝自動送信される","3つとも保存できる容量が違うだけで、寿命とサーバーへの送信の挙動は同じである","localStorage は暗号化されるため、認証トークンの保存に最も適している","Cookie はサーバー専用のため、ブラウザの JavaScript からは読み書きできない"],answer:0,explain:"違いは「寿命」と「サーバーへ送られるか」。Cookie は同じドメインへのリクエストに自動で付くのでログイン状態の保持に使われるが、その自動送信が CSRF の入口にもなる。localStorage は自動送信されない代わりに JS から自由に読めるため、XSS が起きるとトークンを盗まれる。どちらも一長一短で、暗号化もされない。なお HttpOnly を付けた Cookie は JS から読めない（が、それは設定によるもの）。"},
  {lv:3,cat:"フロント / ブラウザの仕組み",situation:"JavaScript を修正してデプロイしたが、一部のユーザーで古い挙動が続いている。HTML は新しくなっている。",q:"原因と根本対策として正しいのはどれ？",options:["JS ファイルがキャッシュされている。ファイル名にハッシュを含め、内容が変われば別 URL にする","JS の配信に失敗している。CDN の設定を見直して再デプロイする","ブラウザの互換性の問題である。古いブラウザ向けにコードを変換する","JS の読み込み順が変わった。script タグの位置を先頭に移動する"],answer:0,explain:"HTML は新しいのに JS が古いなら、ファイル単位でキャッシュが効いている。手動でキャッシュを消してもらう運用は再発するので、根本対策は「内容が変わったら URL も変わる」構造にすること（app.a1b2c3.js のようにハッシュを埋める）。URL が違えばブラウザは別ファイルとして必ず取りに行くので、キャッシュを長く効かせたまま更新を確実に届けられる。書類の版数を名前に入れて取り違えを防ぐのと同じ。"},
  {lv:3,cat:"フロント / ブラウザの仕組み",situation:"別ドメインの API を fetch したところ、ブラウザのコンソールに CORS のエラーが出た。API 自体は curl では正常に応答する。",q:"正しい対処はどれ？",options:["API サーバー側で、呼び出し元オリジンを許可するレスポンスヘッダーを返すよう設定する","フロント側の fetch のオプションで mode を no-cors にして、制限を回避する","API の URL を相対パスに書き換えて、同一オリジンとして扱わせる","ブラウザのセキュリティ設定を無効化して開発を進める"],answer:0,explain:"CORS はブラウザの安全装置で、「別オリジンからの読み取りを、サーバーが許可表明していない限り使わせない」というルール。だから許可を出せるのはサーバー側だけで、フロントの書き方で回避するものではない（no-cors はレスポンスを読めなくなるだけ）。正攻法は API 側で Access-Control-Allow-Origin などを返すこと。自分で API を変更できない場合は、自サーバーに中継口を置いて同一オリジン経由にする（プロキシ）。ブラウザ設定の無効化は自分の環境でしか通らず、他のユーザーには何も解決しない。"},
  {lv:2,cat:"フロント / ブラウザの仕組み",situation:"HTML には見出し・段落・ボタン・リストなど、意味を持つタグがある。すべてを div と span で組んでも見た目は同じにできる。",q:"それでも意味に合ったタグを使う理由として最も重要なのはどれ？",options:["支援技術やキーボード操作、検索エンジンに構造が伝わり、button なら Enter で押せる","div より記述量が少なく、HTML のファイルサイズを削減できる","ブラウザの描画処理が速くなり、ページの表示速度が向上する","CSS の記述が短くなり、クラス名を付けずにスタイルを当てられる"],answer:0,explain:"タグの選択は「機械に意味を伝える」行為。button を使えばキーボードのフォーカスや Enter での実行、支援技術への「これはボタンです」という通知が最初から付いてくるが、div にクリックイベントを付けた偽ボタンは、キーボードだけの利用者が押せないことがある。点字ブロックのある道と、見た目だけ同じ道の違い。ファイルサイズや描画速度は本質的な理由ではない。"},
  {lv:1,cat:"フロント / HTML と CSS",situation:"CSS で要素の幅を width:200px、padding:20px、border:1px と指定した。",q:"標準のボックスモデル（box-sizing:content-box）における実際の表示幅はどれ？",options:["242px（内容200＋左右padding40＋左右border2）","200px（width の指定がそのまま表示幅になる）","240px（内容200＋左右padding40。border は幅に含まれない）","220px（内容200＋padding20＋border は無視される）"],answer:0,explain:"既定では width は「内容の幅」を指すため、padding と border は外側に足される。だから 200 と指定しても実際は 242px 占める。この直感とのズレがレイアウト崩れの定番原因なので、実務では box-sizing:border-box を全体に適用して「width＝枠まで含めた幅」に揃えるのが定石（多くの CSS フレームワークが既定でこれを行う）。箱の内寸と外寸のどちらを言っているか、という話。"},
  {lv:1,cat:"フロント / HTML と CSS",situation:"同じ要素に対して複数の CSS ルールが当たっており、どれが適用されるか分からない。",q:"適用の決まり方として正しいのはどれ？",options:["詳細度（セレクタの強さ）が高いルールが勝ち、同じ詳細度なら後に書かれたものが勝つ","ファイルの読み込み順だけで決まり、後から読み込んだファイルが常に勝つ","記述量が多いルールが優先され、プロパティ数の多い方が適用される","すべてのルールが合成され、数値は平均値が使われる"],answer:0,explain:"優先順位は主に詳細度で決まる（id 指定＞クラス指定＞タグ指定、インライン記述はさらに強い）。同点なら後勝ち。この仕組みを知らないと「書いたのに効かない」に延々はまるので、効かないときは Elements タブで打ち消し線の付いた行を見て、何に負けているかを確認するのが早い。なお !important は詳細度を飛び越えて勝つが、以後の上書きを困難にするため濫用は避ける。"},
  {lv:2,cat:"フロント / HTML と CSS",situation:"横並びのレイアウトを作る。Flexbox と Grid のどちらを使うか迷っている。",q:"使い分けの考え方として最も適切なのはどれ？",options:["1方向に並べて分配するなら Flexbox、行と列の両方を定義して敷き詰めるなら Grid","Flexbox は古い技術なので、新規実装では常に Grid を使うべきである","Flexbox は横並び専用、Grid は縦並び専用という方向の違いである","Grid は対応ブラウザが限られるため、業務では Flexbox のみを使う"],answer:0,explain:"Flexbox は「1本の軸に沿って並べ、余りをどう配るか」を扱う道具で、ナビゲーションやボタン列に向く。Grid は「行と列の格子を定義して、そこに要素を配置する」道具で、ページ全体の骨組みやカードの敷き詰めに向く。棚を1段だけ使うか、方眼状の棚を組むかの違い。どちらも現行ブラウザで問題なく使え、新旧の優劣ではないので、作りたい形で選ぶ（入れ子で併用するのが普通）。"},
  {lv:2,cat:"フロント / HTML と CSS",situation:"スマートフォンでの表示を整えるためにレスポンシブ対応を行う。",q:"実装の基本として正しいのはどれ？",options:["viewport の meta タグを設定し、相対的な幅とメディアクエリで画面幅に応じてレイアウトを切り替える","端末を判定して、スマートフォン用の別 URL へリダイレクトする","固定幅で作ったページを、CSS の transform:scale で縮小して表示する","画面幅ごとに固定の px 幅を指定した CSS を複数用意し、すべてを読み込む"],answer:0,explain:"レスポンシブの土台は3点。①viewport の meta（これが無いとスマホが仮想的に広い画面として描画し全体が縮む）、②幅を % や max-width などの相対値で持つ、③必要な箇所でメディアクエリを使い、1カラムに落とすなど構造を切り替える。1つの HTML/CSS で全画面幅に対応するので保守が1系統に収まる。別 URL 方式は二重保守と URL 分散を招き、全体縮小は文字が読めなくなる。"},
  {lv:2,cat:"フロント / HTML と CSS",situation:"CSS が増えるにつれ、クラス名の衝突と「どこで効いているか分からない」問題が起きてきた。BEM や Tailwind CSS のような手法が候補に挙がっている。",q:"これらが共通して解決しようとしている問題はどれ？",options:["スタイルの影響範囲を予測可能にすること。命名規約か、部品側への直接指定で局所化する","CSS のファイルサイズを削減して、読み込み速度を上げること","ブラウザ間の表示差異を吸収して、互換性を確保すること","アニメーションの記述を簡単にして、実装工数を減らすこと"],answer:0,explain:"CSS の一番の難しさは「大域的に効いてしまう」こと。ある場所を直したら関係ないページが崩れる、という事故の原因はここにある。BEM は名前に構造を持たせて衝突と影響範囲を人間の規約で抑え、Tailwind は要素側にユーティリティを直接書くことで共有定義そのものを減らす。どちらも狙いは同じ「変更の影響を局所に閉じ込める」。サイズ・互換性・アニメーションは主目的ではない。"},
  {lv:3,cat:"フロント / HTML と CSS",situation:"ダークモード対応や配色変更のたびに、多数の CSS ファイルで色コードを一つずつ書き換えている。",q:"改善策として最も適切なのはどれ？",options:["色を CSS カスタムプロパティ（変数）として一箇所に定義し、各所からそれを参照する形に変える","色ごとにクラスを大量に用意し、HTML 側でクラスを差し替える運用にする","色コードを検索置換しやすい命名規則にして、置換作業を効率化する","ダークモード用の CSS ファイルを別に用意し、全ルールを複製して管理する"],answer:0,explain:"同じ値が何十箇所にも散っている状態が原因なので、参照する形に変えて「定義は1箇所」にするのが根本策。変数にしておけば、テーマ切り替えは変数の値を差し替えるだけで済む。分電盤を1つにまとめるのと同じ発想。検索置換の効率化は作業を速くするだけで散在は残り、全ルール複製は同じ内容を2重に保守することになって必ずズレる。"},
  {lv:3,cat:"フロント / HTML と CSS",situation:"クリックできるカードを実装した。div に onClick を付け、CSS で cursor:pointer を指定している。",q:"アクセシビリティ上の問題と対策として正しいのはどれ？",options:["キーボードで到達・実行できず役割も伝わらない。button や a を使う","色のコントラストが不足している可能性がある。文字色を濃くする","クリック領域が小さい可能性がある。padding を増やして押しやすくする","マウスオーバーの反応が分かりにくい。hover 時の背景色を変える"],answer:0,explain:"見た目が同じでも、div はボタンではない。フォーカスが当たらないためキーボードだけの利用者は実行できず、スクリーンリーダーにも「押せるもの」と伝わらない。まずは本来のタグ（button / a）を使うのが最短で、既定のフォーカス・Enter/Space 実行・役割通知が全部付いてくる。どうしても div を使うなら role=\"button\"、tabindex=\"0\"、キーイベント処理を自分で足す必要がある。他の選択肢は改善ではあるが、操作不能という欠陥は解消しない。"},
  {lv:2,cat:"フロント / HTML と CSS",situation:"ページ内の画像に alt 属性を書く場面。装飾目的の画像と、意味を持つ画像が混在している。",q:"適切な書き方はどれ？",options:["意味のある画像は内容を説明する文を書き、装飾だけの画像は alt=\"\" として読み上げ対象から外す","すべての画像にファイル名を alt として入れておく","装飾画像にも必ず説明文を書き、読み上げの情報量を増やす","alt は SEO 目的の属性なので、検索されたいキーワードを列挙する"],answer:0,explain:"alt は「画像が見えない人・表示されない場合に、代わりに伝わるべき文」。だからグラフや商品写真は内容を説明し、飾りの罫線やアイコンは空にして読み飛ばさせるのが正解（空文字にすることで「意味のない画像」と明示できる）。ファイル名の羅列や装飾への説明は、読み上げをノイズだらけにして逆に使いにくくする。キーワードの詰め込みは本来の目的から外れ、評価上も推奨されない。"},
  {lv:1,cat:"フロント / JavaScript と型",situation:"変数宣言に var、let、const がある。",q:"使い分けの基本として正しいのはどれ？",options:["再代入しないものは const、する必要があるものは let。var は古い挙動（関数スコープと巻き上げ）のため新規では使わない","const は定数専用なのでオブジェクトの中身も一切変更できず、変更が必要なら必ず let を使う","let と const の違いはスコープの広さで、let の方が広い範囲で参照できる","var はグローバル変数専用で、let と const はローカル変数専用である"],answer:0,explain:"既定を const にすると「この変数は後から差し替わらない」と読み手に約束できるので、追う範囲が減って読みやすくなる。注意点は、const が固定するのは「変数がどれを指すか」だけで、オブジェクトや配列の中身は変更できること（箱の宛先は固定、中身は入れ替え可能）。var はブロックを無視する古い仕組みでバグの元になるため新規では使わない。let と const のスコープは同じ（どちらもブロック）。"},
  {lv:1,cat:"フロント / JavaScript と型",situation:"API からデータを取得する処理で、await を付け忘れると意図しない結果になる。",q:"非同期処理と Promise の理解として正しいのはどれ？",options:["時間のかかる処理は結果を待たずに先へ進み、Promise は「後で結果が入る箱」を表す","Promise は処理を並列実行するための仕組みで、await を付けると並列度が上がる","await を付けなければ処理は実行されず、付けたときだけ通信が始まる","非同期処理は別スレッドで動くため、重い計算も画面を止めずに実行できる"],answer:0,explain:"JavaScript は結果を待って止まる代わりに、「終わったら教える」という約束（Promise）を先に返す。番号札を受け取って他のことをするイメージ。await はその札を持って結果が届くまで待つ指示なので、付け忘れると中身ではなく箱のまま次の処理に渡してしまう（undefined になる典型原因）。await の有無に関わらず処理自体は始まっており、並列度の制御でもない。また JS は基本的に単一スレッドなので、重い計算は画面を止める（Web Worker を使えば別）。"},
  {lv:2,cat:"フロント / JavaScript と型",situation:"3つの API を呼び出す処理がある。互いに依存はなく、すべての結果が揃ってから画面を描画したい。",q:"実装として最も適切なのはどれ？",options:["Promise.all で3つを同時に開始し、すべて完了するのを待つ","await を3回並べて、1つずつ順番に完了を待つ","3つを for 文の中で await して、ループで順次処理する","3つのうち最も速い1つの結果で描画し、残りは破棄する"],answer:0,explain:"依存がないなら同時に始めるのが最短。順番に await すると、それぞれ0.5秒でも合計1.5秒かかるが、同時なら最も遅い1本ぶん（0.5秒）で済む。3人に同時に頼むか、1人ずつ順に頼むかの違い。for 文内の await も実質的に直列。Promise.all は1つ失敗すると全体が失敗する点に注意で、部分的な失敗を許容したいときは Promise.allSettled を使う。"},
  {lv:2,cat:"フロント / JavaScript と型",situation:"JavaScript に TypeScript を導入するか検討している。実行時の速度は変わらないと聞いた。",q:"それでも導入する価値として最も本質的なのはどれ？",options:["実行前（コンパイル時）に型の不整合を検出でき、変更時の壊れを機械が指摘してくれる","実行時に型チェックが行われ、不正なデータの流入を防げるようになる","コードの記述量が減り、開発速度が直接的に向上する","古いブラウザでも動くコードへ変換され、互換性の問題が解消される"],answer:0,explain:"価値は「壊れる前に気付ける」こと。関数の引数を1つ増やした瞬間に、呼び出し漏れが全箇所指摘される（人間が grep して探す作業が消える）。加えて型定義そのものが仕様の説明になるので、他人のコードが読みやすくなる。ただし型は実行前の検査であって、実行時には消えるため、外部から来るデータの検証は別途必要（API のレスポンスは型を書いても保証されない）。記述量は増えるし、互換変換はトランスパイラの役割。"},
  {lv:2,cat:"フロント / JavaScript と型",situation:"API のレスポンスから user.profile.name を参照したところ、profile が存在しないケースでエラーになった。",q:"対処として適切なのはどれ？",options:["オプショナルチェーン（user.profile?.name）などで不在を許容し、値が無い場合の表示も決めておく","try-catch で囲んでエラーを握りつぶし、処理を継続させる","参照前に必ず if で3階層すべてを確認する記述を全箇所に書く","API 側で必ず profile を返す仕様に変更してもらうまで実装を止める"],answer:0,explain:"外部から来るデータは「無いかもしれない」前提で扱う。?. は途中が無ければそこで undefined になる書き方で、意図を短く表現できる。ただし本質は「無いときに画面をどう見せるか（未設定と表示する等）」を決めることで、そこを決めずにエラーだけ消すと空欄の理由が分からない画面になる。try-catch での握りつぶしは原因を隠し、全箇所での多段 if は読みにくく漏れる。API 仕様の改善は並行して相談する価値があるが、実装を止める理由にはならない。"},
  {lv:3,cat:"フロント / JavaScript と型",situation:"ボタンを連続で押すと、同じ登録処理が複数回実行されて重複データが作られてしまう。",q:"フロント側の対策として最も適切なのはどれ？",options:["送信中はボタンを無効化し、完了後に戻す。あわせてサーバー側でも重複を防ぐ仕組みを持つ","連打を防ぐため、ボタン押下から一定時間は何も反応しないようにする","送信前に確認ダイアログを出し、ユーザーに二重送信を意識させる","登録後に画面を即座にリロードして、二度目の押下ができない状態にする"],answer:0,explain:"押せる状態のまま待たせるから連打が起きる。だから送信中は無効化して「今処理中」を見せるのが基本（レジで会計中のボタンを塞ぐイメージ）。同時に、フロントの制御は迂回できるためサーバー側でも重複登録を弾く（一意制約や冪等キー）ことが必要で、二段構えが正解。時間で塞ぐ方式は遅い通信で不足し、確認ダイアログは操作を増やすだけで防げず、リロード頼みは処理完了前の押下を防げない。"},
  {lv:3,cat:"フロント / JavaScript と型",situation:"ビルドすると1つの巨大な JS ファイルが生成され、初回表示が遅い。管理画面のような一部の利用者しか開かない機能も含まれている。",q:"改善策として最も効果的なのはどれ？",options:["コード分割（動的 import）を行い、画面ごとに必要な分だけ後から読み込む","JS を圧縮（minify）して、ファイルサイズを削減する","script タグに async を付けて、読み込みをブロックしないようにする","CDN から配信して、ダウンロード速度を改善する"],answer:0,explain:"問題の本質は「今使わないコードまで最初に配っている」こと。分割すれば初回に必要な分だけを送り、管理画面のコードはそこを開いた人にだけ届く。旅行に全財産を持っていくのをやめる、という改善。圧縮・async・CDN はどれも有効だが、送る総量そのものは変わらない（圧縮は数割、CDN は距離、async は待ち方の改善）。まず量を減らし、その上でこれらを併用するのが順序。"},
  {lv:2,cat:"フロント / JavaScript と型",situation:"npm でパッケージを追加すると package.json と package-lock.json が更新される。",q:"lock ファイルの役割として正しいのはどれ？",options:["依存パッケージの実際に入ったバージョンを固定して記録し、誰の環境でも同じ組み合わせを再現できるようにする","インストール済みパッケージの実体を保存し、ネットワークなしでも復元できるようにする","パッケージの脆弱性情報を記録し、危険なバージョンを自動で除外する","開発用と本番用の依存を分離し、それぞれ別に管理できるようにする"],answer:0,explain:"package.json は「^1.2.0 以上の 1.x 系」のような範囲指定で書かれることが多いため、インストールの時期によって実際のバージョンが変わりうる。lock ファイルはそのとき入った正確な版（依存の依存まで）を記録するので、他のメンバーや CI や本番で同じ組み合わせが再現され、「自分の環境だけ動く」を防げる。だからコミット対象に含める。実体は node_modules にあり、脆弱性除外は audit の役割、開発/本番の区別は dependencies と devDependencies で表す。"},
  {lv:1,cat:"フロント / フレームワークと描画",situation:"React や Vue では、画面を「コンポーネント」という単位に分けて作る。",q:"コンポーネント化の利点として最も本質的なのはどれ？",options:["見た目と振る舞いを1つの部品にまとめて再利用でき、修正の影響範囲がその部品の中に閉じる","HTML の記述量が減り、ページのファイルサイズが小さくなる","ページの読み込み速度が向上し、表示が速くなる","CSS を書かずにデザインを適用できるようになる"],answer:0,explain:"効くのは「変更したときに、どこまで影響するかが読めること」。ボタンの見た目を直したいときに、部品を1つ直せば全画面に反映され、しかもその部品の外は壊れない。レゴのブロックを差し替える感覚。逆に部品の境界が曖昧だと、直すたびに他の画面を壊す。ファイルサイズや速度は本質的な利点ではない（むしろフレームワークのぶん増えることもある）。"},
  {lv:1,cat:"フロント / フレームワークと描画",situation:"SPA（シングルページアプリケーション）と、従来のサーバーがページごとに HTML を返す方式を比較している。",q:"SPA の特徴として正しいのはどれ？",options:["最初の読み込み後は画面遷移を JS が担い、操作が滑らかな反面、初回が重くなりやすい","サーバーが不要になり、静的ファイルの配信だけでアプリが完結する","検索エンジンへの対応が自動的に改善され、SEO が有利になる","JavaScript を使わずに画面遷移を実現する方式である"],answer:0,explain:"SPA は「1枚の器を先に配り、中身だけ差し替える」方式。ページ全体を再取得しないので遷移が速く、アプリのような操作感になる。代償は、最初に JS 一式を読む重さと、JS が実行されないと中身が無いという性質（初期表示や検索エンジンへの見え方が課題になりやすく、SSR などで補う）。データを返すサーバーは依然必要で、SEO は自動で有利になるどころか対策が必要な側。"},
  {lv:2,cat:"フロント / フレームワークと描画",situation:"CSR、SSR、SSG という描画方式の選択肢がある。",q:"それぞれの説明として正しいのはどれ？",options:["CSR＝ブラウザで描画、SSR＝リクエスト時にサーバーで HTML を生成、SSG＝ビルド時に HTML を生成して配信","CSR＝クライアントに処理を寄せる方式、SSR＝サーバーに寄せる方式、SSG＝両方を同時に行う方式","CSR＝開発時のみ使う方式、SSR＝本番用の方式、SSG＝静的サイト専用の方式","CSR＝React 用、SSR＝Vue 用、SSG＝フレームワークを使わない場合の方式"],answer:0,explain:"違いは「HTML をいつ・どこで作るか」。CSR は空の器を返して JS が中身を作る（初期表示が遅く SEO に不利だが、サーバー負荷は軽い）。SSR はアクセスごとにサーバーで組むので最新かつ初期表示が速い（サーバー負荷は上がる）。SSG は事前に作り置きするので最速・最安だが、内容の更新にはビルドが必要。料理を注文後に作るか、作り置きするか、客が自分で仕上げるかの違い。フレームワーク別の区分ではない。"},
  {lv:2,cat:"フロント / フレームワークと描画",situation:"コンポーネントの中で扱うデータを、props で受け取るか、内部の state として持つかを決める必要がある。",q:"判断の基準として正しいのはどれ？",options:["親から渡され自分は変更しない値は props、部品の中だけで変化する値は state","再利用する部品は props、しない部品は state を使う","文字列は props、数値やオブジェクトは state で持つ","state は非推奨なので、可能な限りすべて props で受け取る"],answer:0,explain:"基準は「誰が持ち主か」。開閉状態のように部品の中だけの関心事は state、表示する内容のように外から与えられるものは props。重要なのは同じ情報を二重に持たないこと（props をそのまま state にコピーすると、親が更新しても古い値が残るという典型バグになる）。台帳を2冊作れば必ずズレる、という話。データ型や再利用の有無で決めるものではない。"},
  {lv:3,cat:"フロント / フレームワークと描画",situation:"複数の画面で同じユーザー情報が必要になり、props で何階層も渡す実装（バケツリレー）が増えてきた。",q:"対策の考え方として最も適切なのはどれ？",options:["広く共有される状態は Context や状態管理ライブラリで共有する。ただし共有範囲は必要最小限に留める","すべての状態をグローバルに置き、どこからでも参照できるようにする","階層が深くなる箇所はコンポーネントを統合して、階層自体を浅くする","props の受け渡しを自動生成するユーティリティを作り、記述量を減らす"],answer:0,explain:"複数箇所で必要な状態は共有の置き場に出すのが自然。ただし何でもグローバルにすると、どこから変更されるか追えなくなり、変更時の影響範囲が全画面に広がる（共有の落とし穴）。だから「本当に広く必要なもの（ログインユーザー、テーマ）」だけを外に出し、それ以外は局所に留めるのが原則。共有スペースに全員の私物を置けば管理不能になるのと同じ。階層統合は部品の責務を壊し、記述量の削減は問題の本質ではない。"},
  {lv:3,cat:"フロント / フレームワークと描画",situation:"SSR したページで、サーバーが返した HTML とブラウザ側の初回描画結果が一致せず、警告やちらつきが発生した。",q:"原因になりやすいものはどれ？",options:["現在時刻やランダム値、ブラウザ固有の情報を描画に使っており、サーバーとブラウザで結果が変わっている","サーバーとブラウザで異なるバージョンのフレームワークを使っている","CSS の読み込みが遅く、スタイルが後から適用されている","API のレスポンスが遅く、データの到着が描画に間に合っていない"],answer:0,explain:"SSR は「サーバーが作った HTML に、ブラウザ側で JS が同じ結果を対応付けて動かす」（ハイドレーション）方式なので、両者の出力が一致していることが前提。時刻・乱数・画面幅・localStorage などサーバーには存在しない情報を描画に混ぜると出力がずれ、不一致の警告や表示のちらつきが起きる。台本どおりに動くはずの舞台で、片方だけ違うセリフを言った状態。対策は、そうした値を初回描画では使わず、マウント後に反映すること。"},
  {lv:2,cat:"フロント / フレームワークと描画",situation:"React のフックである useEffect の使い方について議論している。",q:"適切な使い方はどれ？",options:["外部との同期（購読の開始、DOM の直接操作、データ取得など）に使い、依存配列と後片付けを正しく指定する","描画に必要な値の計算を行い、レンダリング結果を組み立てる","props を state にコピーして、コンポーネント内で使いやすくする","再レンダリングを抑制する目的で、処理を包んで遅延させる"],answer:0,explain:"useEffect は「描画の外側の世界に触るための出口」。購読の開始や外部システムとの同期がその役目で、始めたものは後片付け（解除）が必要になる。依存配列を誤ると、動かない（更新されない）か何度も走る（無限ループ）のどちらかになるのが定番の躓き。描画に必要な値は素直に計算して返せばよく（副作用に置くと1回余分に描画される）、props の state へのコピーはズレの原因、再描画の抑制は memo 系の役割。"},
  {lv:2,cat:"フロント / フレームワークと描画",situation:"一覧を map で描画したところ、key の警告が出た。index を key に使う案が出ている。",q:"key の役割と適切な指定はどれ？",options:["どの要素がどのデータかを対応付ける識別子。並び替えや削除がある一覧では安定した ID を使う","描画順を指定する属性なので、index を使うのが本来の用途である","要素の一意性を検証するための開発用の属性で、本番では不要になる","スタイルを適用する対象を特定するための属性である"],answer:0,explain:"key は「前回の要素と今回の要素が同一かどうか」を判断する目印。安定した ID を渡せば、並び替えや削除でも要素と状態が正しく追随する。index を使うと、先頭を削除したときに以降の番号が全部ずれ、入力中のフォームの値が別の行に残るといった不具合が起きる（クローク番号を毎回振り直すと荷物が入れ替わる）。並び順が固定で追加削除もない一覧なら index でも実害は出にくいが、既定の選択にはしない。"},
  {lv:1,cat:"フロント / 通信とパフォーマンス",situation:"画面で API を呼ぶとき、成功だけでなく通信中と失敗も起こりうる。",q:"UI の実装として適切なのはどれ？",options:["読み込み中・成功・失敗の3状態を扱い、失敗時は原因の見当と次の操作（再試行など）を示す","成功時の表示のみ実装し、失敗時はブラウザのエラー表示に任せる","通信中は画面全体を操作不能にし、失敗したら自動で再読み込みを繰り返す","失敗時は何も表示せず、ユーザーが再度操作するのを待つ"],answer:0,explain:"通信は必ず失敗しうるので、3状態は仕様の一部。読み込み中が見えないとユーザーは連打し、失敗が見えないと「押したのに何も起きない」不信になる。特に失敗表示は「何が起きたか」と「次にどうするか」の2つを含めるのが要点（エラーコードだけ出しても人は動けない）。全画面ブロックや自動リトライの連打は、体験を損なううえサーバー負荷も上げる。"},
  {lv:1,cat:"フロント / 通信とパフォーマンス",situation:"Web の表示品質を測る指標として Core Web Vitals（LCP / CLS / INP）がある。",q:"それぞれが測っているものとして正しいのはどれ？",options:["LCP＝主要な内容が表示されるまでの速さ、CLS＝表示のずれ（ガタつき）、INP＝操作への反応の速さ","LCP＝ページ全体の読み込み完了時間、CLS＝JS の実行時間、INP＝通信回数","LCP＝サーバーの応答時間、CLS＝CSS のファイルサイズ、INP＝画像の枚数","LCP＝最初の描画までの時間、CLS＝レイアウトの複雑さ、INP＝入力欄の数"],answer:0,explain:"3つはユーザーが体感する3種類の不満に対応している。「なかなか出ない」（LCP）、「読もうとしたら動いてズレた」（CLS：画像の高さ指定漏れや後から挿入される広告が主因）、「押しても反応しない」（INP）。だから改善のとき、遅いのか・ずれるのか・重いのかで打ち手が変わる。全体の読み込み完了時間のような単一指標ではなく、体験を分解して測る考え方が要点。"},
  {lv:2,cat:"フロント / 通信とパフォーマンス",situation:"一覧ページに大きな画像を多数掲載している。表示が遅い。",q:"最も効果が大きい対策の組み合わせはどれ？",options:["表示サイズに合わせた画像を配信し、次世代フォーマットを使い、画面外の画像は遅延読み込みにする","画像を CSS の background-image に変更して、HTML から分離する","画像の枚数を減らし、掲載する商品数そのものを削減する","画像を base64 に変換して HTML に埋め込み、通信回数を減らす"],answer:0,explain:"画像は多くのサイトで転送量の最大要因なので、①必要な寸法まで縮める（4000px の写真を 300px 枠で出すのが典型的な無駄）、②WebP/AVIF など効率の良い形式にする、③今見えていない画像は後から読む（loading=\"lazy\"）の3点が定石。背景画像化は遅延読み込みの制御が難しくなり、掲載数の削減は要件を壊す。base64 埋め込みはサイズが約1.3倍に増えキャッシュも効かなくなるため、大きな画像には不向き。"},
  {lv:2,cat:"フロント / 通信とパフォーマンス",situation:"検索ボックスに文字を入力するたびに API を呼び出しており、1文字ごとにリクエストが飛んでいる。",q:"対策として適切なのはどれ？",options:["入力が一定時間止まってから送るデバウンスを入れ、不要になった前のリクエストは中断する","入力を確定するボタンを設け、ボタン押下時のみ検索する仕様に変更する","サーバー側にキャッシュを入れて、同じ検索語の応答を速くする","1文字目のリクエストだけを送り、以降の入力は無視する"],answer:0,explain:"問題は「まだ確定していない入力に対して毎回問い合わせている」こと。デバウンス（例: 300ms 入力が止まったら送る）にすれば通信は激減し、逐次検索の体験は保てる。加えて古いリクエストの結果が後から届いて新しい結果を上書きする事故（競合）を防ぐため、前のリクエストを中断するのが定石。ボタン方式は体験を落とす仕様変更、サーバーキャッシュは呼び出し回数自体を減らさない、入力無視は機能として成立しない。"},
  {lv:3,cat:"フロント / 通信とパフォーマンス",situation:"同じユーザー情報を複数のコンポーネントがそれぞれ API から取得しており、1画面で同じリクエストが何度も飛んでいる。",q:"改善策として最も適切なのはどれ？",options:["取得結果をキャッシュして共有し、同時発生した同一リクエストは1本にまとめる","各コンポーネントの取得処理を親に集約し、props で全階層に配る","取得処理に遅延を入れて、リクエストが重ならないようにずらす","API 側で同一ユーザーの連続リクエストを制限し、2回目以降を拒否する"],answer:0,explain:"重複の原因は「取得結果の置き場が共有されていない」こと。共有キャッシュを持てば、2回目以降は取得済みの値を返せるし、同時に発生した同じ要求は1本にまとめられる（React Query や SWR がこれを担う）。買い物リストを共有すれば同じ物を3人で買わずに済む、という話。親への集約はバケツリレーを生み、遅延はリクエスト数を減らさず、API 側の拒否は正当な利用まで壊す。"},
  {lv:3,cat:"フロント / 通信とパフォーマンス",situation:"SPA で作った公開サイトが、検索結果に内容として反映されにくいという課題が出た。",q:"対策として最も効果的なのはどれ？",options:["初期 HTML に本文が含まれる方式（SSR や SSG）へ切り替える","meta キーワードを充実させ、対策したい語を多数記述する","サイトマップを送信して、検索エンジンにクロールされる頻度を上げる","画像の alt に検索対象の語を詰めて、ページとの関連性を高める"],answer:0,explain:"根本原因は「最初に返る HTML が空で、中身が JS 実行後にしか存在しない」こと。だから本文が初期 HTML に載る方式へ変えるのが本命で、同時に各ページのタイトル・説明・OG 情報もサーバー側で出力する（SNS のプレビューにも効く）。meta キーワードは現在ほぼ評価されず、サイトマップは発見を助けるだけで中身が空なら評価されない。alt への詰め込みは本来の用途を外れる。"},
  {lv:2,cat:"フロント / 通信とパフォーマンス",situation:"HTTP レスポンスヘッダーの Cache-Control でキャッシュの扱いを指定できる。HTML と、ハッシュ付きの JS/CSS ファイルがある。",q:"設定方針として適切なのはどれ？",options:["ハッシュ付きの資材は長期間キャッシュさせ、HTML はキャッシュさせない（毎回確認させる）","HTML も資材もすべて長期間キャッシュさせ、更新時は利用者に再読み込みを依頼する","すべてキャッシュを無効にして、常に最新を取得させる","キャッシュ期間は資材の種類ではなく、ファイルサイズの大小で決める"],answer:0,explain:"鍵は「内容が変われば URL も変わるか」。ハッシュ付きファイルは内容ごとに別 URL になるので、古い URL を長く保持させても害がなく、通信を大幅に減らせる。一方 HTML は URL が変わらないまま中身が変わるため、キャッシュさせると新しい資材への参照が届かない。だから HTML は毎回確認、資材は長期保持という組み合わせが定石。全キャッシュ無効は毎回全部取り直しで遅く、サイズ基準は無関係。"},
  {lv:3,cat:"フロント / 通信とパフォーマンス",situation:"表示は速いが、操作したときの反応が鈍い。入力するとカクつき、クリックしてもすぐ反応しない。",q:"原因の見立てとして最も可能性が高いのはどれ？",options:["メインスレッドを長く占有する JS 処理があり、操作の処理が待たされている","画像のサイズが大きく、ダウンロードに時間がかかっている","サーバーの応答が遅く、API の結果待ちが発生している","CSS のセレクタが複雑で、スタイルの計算に時間がかかっている"],answer:0,explain:"「表示は速いが反応が鈍い」は、通信ではなく実行の問題を示す症状。JavaScript は基本的に1本の作業列（メインスレッド）で動くので、そこで重い処理が走っている間はクリックも入力も順番待ちになる。1人しかいないレジで長い会計が始まった状態。対策は処理を分割する、計算量を減らす、大量描画を仮想スクロールにする、重い計算を Web Worker に出す、など。画像やサーバー応答は表示の速さに関わる要因で、この症状の説明にはならない。"},
  {lv:1,cat:"Git / 仕組みと3つの領域",situation:"Git にはワーキングツリー・インデックス（ステージ）・リポジトリという3つの場所がある。",q:"3つの関係として正しいのはどれ？",options:["編集中のファイルがワーキングツリー、コミットに含めると決めたものを置くのがインデックス、確定した履歴が入るのがリポジトリ","ワーキングツリーがローカル、インデックスが手元のキャッシュ、リポジトリが GitHub 上の保管場所","3つとも同じ内容の複製で、バックアップとして多重化されている","ワーキングツリーが最新、インデックスが1つ前、リポジトリが2つ前の状態を保持する"],answer:0,explain:"作業机（ワーキングツリー）→レジ台（インデックス）→レシートの控え（リポジトリ）と考えると分かりやすい。机の上でいくら書き換えても履歴には入らず、レジ台に載せたもの（git add）だけがコミットに含まれる。この2段階があるおかげで、5ファイル編集したうち3ファイルだけを1つのコミットにまとめる、という選別ができる。リポジトリは手元にもあり（ローカルリポジトリ）、GitHub 上のものはリモートと呼ぶ別の存在。"},
  {lv:1,cat:"Git / 仕組みと3つの領域",situation:"ファイルを編集した後、git status を実行した。",q:"git status で分かることとして正しいのはどれ？",options:["どのファイルが変更され、そのうちどれがステージ済みか、追跡されていないファイルがあるか","変更された行の具体的な内容と、変更前後の差分","過去のコミットの一覧と、それぞれのコミットメッセージ","リモートリポジトリに存在するブランチと、その最新コミットの一覧"],answer:0,explain:"status は「今どういう状態か」の見取り図。変更あり・ステージ済み・未追跡（新規でまだ Git が管理していない）の3分類が読めるので、コミット前に必ず見る習慣を付けると「意図しないファイルを混ぜた」を防げる。行単位の差分は git diff、コミット一覧は git log、リモートのブランチは git branch -r が担当。役割を分けて覚えるとコマンド選びに迷わない。"},
  {lv:2,cat:"Git / 仕組みと3つの領域",situation:"5つのファイルを編集した。そのうち3つは機能A、2つは機能Bの変更である。",q:"コミットの作り方として最も適切なのはどれ？",options:["機能Aの3ファイルだけを git add してコミットし、次に機能Bの2ファイルを別のコミットにする","5ファイルすべてを1つのコミットにまとめ、メッセージに両方の内容を書く","ファイルごとに5つのコミットに分け、1ファイル1コミットを徹底する","まず5ファイルすべてをコミットしてから、後で履歴を分割し直す"],answer:0,explain:"コミットの単位は「意味のあるひとまとまり」。1コミット＝1つの目的にしておくと、後から履歴を読んだときに何をしたのか分かり、問題が起きたときそのコミットだけを取り消せる。混ぜてしまうと、機能Bだけ戻したいのに機能Aも一緒に消える。荷物を用途別に箱詰めするのと同じ。ファイル単位で機械的に分けると、1つの変更が複数コミットに散って逆に追えなくなる。"},
  {lv:2,cat:"Git / 仕組みと3つの領域",situation:"ビルド成果物のディレクトリや、環境変数を書いた .env ファイルが git status に毎回出てくる。",q:"適切な対処はどれ？",options:[".gitignore に追記して管理対象から外す。コミット済みなら追跡の解除も必要","毎回コミット対象から手動で除外して、混ざらないよう注意する","ファイルを別のディレクトリへ移動して、リポジトリの外に置く","中身を空にしてコミットし、実際の値は各自が手元で書き換える"],answer:0,explain:".gitignore は「これは履歴に入れない」という宣言。生成物（ビルド結果、node_modules）は元から作り直せるので入れる必要がなく、秘密情報は入れてはいけない。注意すべきは、.gitignore は未追跡ファイルにしか効かないこと。すでにコミットしてしまったものは git rm --cached で追跡を外す必要がある。手動での注意は必ず事故るし、空ファイルをコミットする方式は誤って値を書いた版を push する危険が残る（.env.example のように別名の見本を置くのが定石）。"},
  {lv:2,cat:"Git / 仕組みと3つの領域",situation:"git log を見ると、コミットに 7〜40 桁の英数字（ハッシュ）が付いている。",q:"コミットハッシュの性質として正しいのはどれ？",options:["コミットの内容と親コミット・作成者などから計算される一意な識別子。内容が変わればハッシュも変わる","コミットの順番を表す連番を16進数で表記したもの","作成者ごとに割り当てられた ID で、同じ人のコミットは同じ値になる","ブランチごとに独立した番号で、ブランチをまたぐと重複しうる"],answer:0,explain:"ハッシュは中身から計算される指紋。だから同じ変更でも作成者や時刻が違えば別の値になり、逆に「ハッシュが同じなら中身も履歴も同じ」と言える。ここが重要なのは、rebase や amend で履歴を作り直すと内容が変わるためハッシュも変わる＝別のコミットになる、という点。これが「共有済みの履歴を書き換えると他人と食い違う」理由の正体。連番でも作成者 ID でもなく、リポジトリ全体で一意。"},
  {lv:3,cat:"Git / 仕組みと3つの領域",situation:"git add した後、まだコミットしていない状態で「ステージから戻したい」と思った。作業内容そのものは消したくない。",q:"適切な操作はどれ？",options:["git restore --staged <file> でステージから外す。変更内容はそのまま残る","git checkout -- <file> で変更を破棄する","git reset --hard で作業内容ごと取り消す","git stash で変更を退避し、必要になったら戻す"],answer:0,explain:"「レジ台から商品を戻す」だけの操作なので、机の上の作業（編集内容）には触らない git restore --staged を使う。混同しやすいのが git checkout -- や git reset --hard で、これらは編集内容そのものを消すため、戻したかっただけなのに作業を失う事故になる（--hard は Git で最も危険な操作の一つ）。stash は退避であって用途が違い、目的に対して回り道。"},
  {lv:3,cat:"Git / 仕組みと3つの領域",situation:"HEAD、ブランチ、コミットという言葉の関係を整理したい。",q:"最も正確な説明はどれ？",options:["コミットは履歴の点、ブランチは特定のコミットを指す軽い目印、HEAD は今自分がどこにいるかを示す指し先","HEAD は最新のコミット、ブランチは作業コピー、コミットは差分ファイルを指す","ブランチはコミットの集合を物理的に複製したもので、切り替えるたびにコピーが作られる","HEAD はリモートの最新状態を指し、ローカルの現在位置はブランチ名だけで表される"],answer:0,explain:"Git のブランチは「重いコピー」ではなく、あるコミットを指す付箋にすぎない。だから作成が一瞬で、いくら作っても軽い。HEAD は「今どの付箋（またはコミット）にいるか」を示す矢印で、git switch すると HEAD の指し先が動く。この3語の関係が分かると、detached HEAD（ブランチではなくコミットを直接指している状態）や、ブランチを進めるだけの fast-forward の意味が自然に理解できる。"},
  {lv:2,cat:"Git / 仕組みと3つの領域",situation:"コミットメッセージの書き方をチームで統一したい。",q:"望ましい書き方はどれ？",options:["1行目に「何をしたか」を簡潔に書き、必要なら空行を挟んで「なぜそうしたか」を本文に書く","変更したファイル名とその行数を列挙して、変更規模が分かるようにする","作業日時と担当者名を先頭に付けて、いつ誰の作業か分かるようにする","「修正」「更新」のような短い語で統一し、詳細は PR の説明に集約する"],answer:0,explain:"履歴を読む人が知りたいのは「何が変わったか」と「なぜそうしたか」。何が変わったかは差分を見れば分かるので、本当に価値があるのは差分から読み取れない意図や背景（なぜこの方式を選んだか、どの不具合に対応したか）。ファイル名や行数は git が持っている情報の重複、日時と担当者はメタ情報として自動で記録される。「修正」だけの羅列は後から探せず、履歴の価値をほぼ失う。"},
  {lv:1,cat:"Git / ブランチ運用",situation:"新しい機能を作るとき、main から新しいブランチを切って作業する運用になっている。",q:"ブランチを切る目的として最も本質的なのはどれ？",options:["main を常に動く状態に保ったまま、未完成の変更を隔離して並行作業できるようにする","作業したファイルを他の人が編集できないようにロックする","変更内容のバックアップを作り、失敗しても元に戻せるようにする","作業ごとにコミット履歴を分けて、進捗を可視化する"],answer:0,explain:"要点は「本線を守る」と「並行できる」。main が常にリリース可能な状態であれば、緊急の修正もそこから即座に出せるし、他人の未完成の変更に巻き込まれない。工事中の道を封鎖せず、迂回路を作って作業するイメージ。ファイルのロックは Git の仕組みにない（同じ箇所を触ればコンフリクトで検出される）。バックアップや可視化は結果として得られる効果。"},
  {lv:1,cat:"Git / ブランチ運用",situation:"ブランチを切り替えるコマンドとして git checkout と git switch がある。",q:"現在の推奨と理由として正しいのはどれ？",options:["ブランチ操作は git switch、ファイルの復元は git restore を使う","git checkout の方が新しく、switch は互換のために残されている古いコマンドである","git switch はリモートブランチ専用で、ローカルブランチには checkout を使う","2つは完全な別名で、どちらを使っても違いはない"],answer:0,explain:"git checkout は「ブランチの切り替え」と「ファイルの復元」という危険度の全く違う操作を兼ねていたため、ファイルを復元するつもりで作業を消す事故が起きやすかった。そこで意図ごとにコマンドを分けたのが switch（移動）と restore（復元）。ハサミと包丁を分けたのと同じで、意図が名前に出るぶん誤操作が減る。checkout も今も使えるが、新しく覚えるなら分離された方を使う。"},
  {lv:2,cat:"Git / ブランチ運用",situation:"作業ブランチを main にマージしようとしたら「Fast-forward」と表示された。",q:"fast-forward の意味として正しいのはどれ？",options:["main が分岐後に進んでいないため、マージコミットを作らずブランチの位置を進めるだけで済んだ","変更が小さいため、Git が差分の計算を省略して高速に処理した","コンフリクトが無かったため、確認をスキップして自動でマージされた","作業ブランチのコミットが1つだけだったため、squash と同等の処理になった"],answer:0,explain:"分岐してから main 側に新しいコミットが無ければ、作業ブランチは main の続きに一直線に並んでいる。だから合流点（マージコミット）を作る必要がなく、main の付箋を先へ動かすだけで済む。これが fast-forward。速度やコンフリクトの有無、コミット数とは関係なく、「履歴が一直線かどうか」で決まる。なお --no-ff を付けると、一直線でも合流点を残して「ここで1つの作業が入った」を履歴に刻める。"},
  {lv:2,cat:"Git / ブランチ運用",situation:"git-flow と GitHub Flow というブランチ戦略がある。チームで採用方針を決めたい。",q:"2つの違いと選び方として正しいのはどれ？",options:["git-flow は多数のブランチでバージョン管理する重い運用、GitHub Flow は main と作業ブランチだけの軽い運用","git-flow は個人開発向け、GitHub Flow は大規模チーム向けという規模による区分である","GitHub Flow は GitHub 専用の仕組みで、他のホスティングでは使えない","git-flow は古く非推奨なので、常に GitHub Flow を採用すべきである"],answer:0,explain:"分岐点は「リリースの形」。パッケージやアプリのように版を作り、複数バージョンを並行保守するなら git-flow の構造が役立つ。Web サービスのように main へマージしたら即デプロイする形なら、ブランチが多いほど手間と混乱が増えるので GitHub Flow が合う。工程が多い工場と、都度出荷する店の違い。規模の区分ではなく、GitHub Flow は名前の由来がそうであるだけでどこでも使える。運用形態が合えば git-flow も有効。"},
  {lv:2,cat:"Git / ブランチ運用",situation:"マージしようとしたところ、同じファイルの同じ行を双方で変更していたためコンフリクトが発生した。",q:"対処として正しいのはどれ？",options:["該当箇所を開き、両方の意図を踏まえて正しい最終形を自分で決め、マーカーを消してからコミットする","自分の変更を必ず優先して、相手側の変更をすべて破棄する","マージを中止して、相手にブランチを作り直してもらう","Git の自動解決に任せて、生成された内容をそのままコミットする"],answer:0,explain:"コンフリクトは異常ではなく「機械には判断できないので人が決めてほしい」という通知。だから正しい対処は、両方の変更の意図を理解して最終形を決めること。片方を機械的に優先すると、相手の修正（バグ修正かもしれない）を静かに消す。2人が同じ書類を別々に直したとき、どちらかを捨てるのではなく、両方の意図を反映した版を作るのが本筋。自動解決に任せられない箇所だからこそコンフリクトになっているので、丸投げはできない。"},
  {lv:3,cat:"Git / ブランチ運用",situation:"長期間（3週間）作業したブランチを main にマージしようとしたら、大量のコンフリクトが発生した。",q:"根本的な改善策として最も適切なのはどれ？",options:["ブランチの寿命を短くし、定期的に main を取り込んで差の蓄積を防ぐ","コンフリクト解決のツールを導入して、解決作業を効率化する","マージ担当者を1人に固定して、解決方法を統一する","作業前にファイル単位で担当を割り振り、同じファイルを触らないようにする"],answer:0,explain:"コンフリクトの量は「分岐してからの時間と変更量」に比例する。3週間分離れていれば、その間の main の変更すべてと突き合わせることになる。だから根本策は距離を開けないこと、すなわち小さく分けて早くマージし、作業中も定期的に main を取り込む（合流点を小刻みに作る）。川が分かれてから遠く離れるほど合流が難しくなる、という構造の話。ツールや担当固定は解決作業を楽にするだけで発生量は減らず、ファイル単位の担当割りは現実の変更範囲と合わず破綻する。"},
  {lv:3,cat:"Git / ブランチ運用",situation:"PR をマージする方法として、マージコミット（--merge）・スカッシュ（--squash）・リベース（--rebase）が選べる。",q:"それぞれの特徴として正しいのはどれ？",options:["マージコミットは経緯が残る、スカッシュは1コミットにまとまる、リベースは一直線になる","マージコミットは履歴が汚れるため避けるべきで、スカッシュが常に最善である","スカッシュは元のコミットも保持されるため、情報を失わずに履歴を整理できる","リベースはコンフリクトが発生しないため、3つの中で最も安全な方式である"],answer:0,explain:"3つは「履歴に何を残すか」の選択で、優劣ではなくチームの方針。マージコミットは「いつ何が合流したか」が残るので追跡に強い（ただし履歴は網目状になる）。スカッシュは PR 単位で1コミットになるので main の履歴が読みやすいが、作業途中のコミットは失われる。リベースは一直線で読みやすい反面、コミットを作り直すためハッシュが変わり、共有済みブランチでは危険。どれを使うかは事前に決めて統一するのが重要。"},
  {lv:2,cat:"Git / ブランチ運用",situation:"マージ済みのブランチが大量に残り、ブランチ一覧が見づらくなっている。",q:"適切な運用はどれ？",options:["マージ済みのブランチは削除する。履歴はマージ先に残るため、ブランチ名を消しても変更は失われない","作業の記録として残す価値があるため、すべてのブランチを保持する","一覧を見る際にフィルタを使い、ブランチ自体は削除しない","古いブランチは main に再マージしてから削除する"],answer:0,explain:"ブランチは「コミットを指す付箋」にすぎないので、マージ済みなら付箋を剥がしても中身（コミット）はマージ先の履歴に残る。だから削除は情報の喪失ではなく、単に散らかった付箋の整理。残し続けると、どれが進行中の作業かが分からなくなり、誤って古いブランチから派生させる事故も起きる。再マージは不要（すでに含まれている）で、フィルタでの回避は根本の散らかりを残す。"},
  {lv:1,cat:"Git / リモート操作",situation:"GitHub 上のリポジトリと、手元のリポジトリの2つが存在する。",q:"origin という名前が指しているものはどれ？",options:["リモートリポジトリに付けられた既定の別名。URL を毎回書かずに参照できる","main ブランチの起点となる最初のコミット","リポジトリを最初に作成した所有者のアカウント名","ローカルとリモートで共通の、履歴の基準点"],answer:0,explain:"origin は URL のあだ名にすぎない。clone すると自動で付けられるので特別なもののように見えるが、git remote add で別名を追加でき、名前も自由（フォーク元を upstream と呼ぶ慣習など）。だから origin/main は「origin という名のリモートの main ブランチの、手元が把握している最新位置」を意味する。最初のコミットや作成者、履歴の基準点ではない。"},
  {lv:2,cat:"Git / リモート操作",situation:"git fetch と git pull の違いを整理したい。",q:"正しい説明はどれ？",options:["fetch はリモートの変更を取得するだけ、pull は取得した上で現在のブランチに統合（マージまたはリベース）する","fetch は差分だけを取得し、pull は全履歴を取得し直す","fetch はローカルの変更を保持し、pull はローカルの変更を破棄する","fetch は読み取り専用リポジトリで使い、pull は書き込み可能な場合に使う"],answer:0,explain:"pull は fetch＋統合の2段階を1コマンドで行うもの。だから「まず状況を見てから統合したい」ときは fetch してログや差分を確認し、それから merge する方が安全（特に相手が履歴を書き換えている可能性があるとき）。荷物を受け取るだけか、受け取って即棚に並べるかの違い。ローカルの未コミット変更は pull でも破棄されない（衝突すれば pull 自体が中止される）。"},
  {lv:2,cat:"Git / リモート操作",situation:"git push しようとしたら「rejected（拒否）」となり、リモートに自分が持っていないコミットがあると表示された。",q:"適切な対処はどれ？",options:["まず fetch/pull でリモートの変更を取り込み、解決してから push する","git push --force で自分の状態を強制的に反映する","新しいブランチを作り、そこに push して既存の履歴は放置する","リモートのブランチを削除してから、改めて push する"],answer:0,explain:"拒否は「あなたの知らない他人のコミットを、上書きで消してしまいますよ」という保護。だから取り込んで統合してから改めて push するのが正しい。--force は保護を無視して他人のコミットを消す操作で、共有ブランチでは絶対に避ける（消えたコミットは相手のローカルにしか残らない）。リモートのブランチ削除も同じ結果になる。どうしても自分の履歴を強制反映する必要がある場面では、せめて --force-with-lease を使い、想定外の変化があれば失敗させる。"},
  {lv:2,cat:"Git / リモート操作",situation:"ローカルのブランチと、リモートの同名ブランチが対応付けられている（追跡ブランチの設定がある）。",q:"追跡設定があることによる利点はどれ？",options:["push や pull の対象を省略でき、リモートとの差（進んでいる/遅れている）も表示される","ローカルの変更が自動でリモートへ同期され、push が不要になる","リモートで削除されたブランチが、ローカルからも自動で削除される","コンフリクトが発生した際に、Git が自動で解決してくれるようになる"],answer:0,explain:"追跡設定は「このローカルブランチの相手はあれ」という紐付け。だから引数なしの push/pull で意図した相手に届き、status に ahead 2 / behind 1 のような差が出る（これが同期状態の把握に効く）。自動同期は行われない（Git は明示的な操作でしか通信しない）し、削除の連動も自動ではない（git fetch --prune で整理する）。コンフリクトの自動解決とも無関係。"},
